<style>
  [v-cloak] {
    display: none !important;
  }

  /* =========================================================
     ZETTBOT: Instant Anti-FOUC Session Guard (Zero-Flicker)
     ========================================================= */
  html.app-authenticated #login-section,
  html.app-authenticated #slot-login {
    display: none !important;
  }
  html.app-authenticated #app-container {
    display: flex !important;
  }
  /* ZETTBOT: Instant Fullscreen Processing Overlay (0ms Anti-Kedip / Zero Jeda on Refresh) */
  html.app-authenticated #global-loader:not(.loader-hidden) {
    display: flex !important;
    opacity: 1 !important;
    pointer-events: auto !important;
  }
  #global-loader.loader-hidden {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  html.app-authenticated:not(.app-loaded) #dashboard-skeleton {
    opacity: 0 !important;
  }
  html.app-unauthenticated #login-section,
  html.app-unauthenticated #slot-login {
    display: flex !important;
  }
  html.app-unauthenticated #app-container {
    display: none !important;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* Glassmorphism Design Token */
  .glass {
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  /* Hide Scrollbar for Chrome, Safari and Opera */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(100, 116, 139, 0.2);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(100, 116, 139, 0.4);
  }

  /* ZETTBOT FIX: Memperbaiki Ikon Kalender Gelap (Native Date Picker) */
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) opacity(0.7);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  input[type="date"]::-webkit-calendar-picker-indicator:hover {
    filter: invert(1) opacity(1);
    transform: scale(1.1);
  }

  /* =========================================================================
     ZETTBOT TAHAP 1 & 3: AGGRESSIVE PRINT MEDIA QUERY
     Mematikan semua canvas, background glow, dan memaksa kertas putih bersih
     ========================================================================= */
  @media print {
    html, body {
      background: #ffffff !important;
      color: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Bunuh semua elemen animasi background, canvas, dan efek blur orb */
    canvas, 
    .fixed.-z-10, 
    div[class*="blur-"] {
      display: none !important;
    }

    /* Pastikan kontainer utama dan semua modal disembunyikan saat mencetak */
    .no-print,
    #app-container,
    #login-section,
    [id^="modal"] {
      display: none !important;
    }

    /* ZETTBOT FIX: Paksa area cetak tampil penuh, TETAPI hormati JavaScript */
    /* Form hanya akan dicetak jika tidak sedang di-hidden oleh JS */
    .print-only:not(.hidden) {
      display: block !important;
      width: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    
    /* Sembunyikan secara absolut form cetak lain yang sedang tidak dipanggil */
    .print-only.hidden {
      display: none !important;
    }

    /* Hilangkan efek kaca/glassmorphism pada kertas */
    .glass {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    
    /* Matikan background warna/abu-abu dari Tailwind jika ikut terbawa */
    .bg-slate-950, .bg-slate-900, .bg-slate-800, .bg-slate-950\/40, .bg-slate-950\/50 {
      background-color: transparent !important;
    }
    
    .text-slate-200, .text-slate-300, .text-slate-400, .text-white {
      color: #000000 !important;
    }
  }

  /* =========================================================================
     ZETTBOT: LIGHT MODE GIMMICK ZONE
     PERHATIAN: Semua modifikasi warna, border, shadow untuk Light Mode 
     WAJIB diletakkan di area ini agar tidak merusak tema Dark bawaan.
     ========================================================================= */
  body {
    transition: background-color 0.6s ease, color 0.6s ease;
  }

  /* ZETTBOT FIX: Penahan animasi saat pertama kali dimuat (Anti-Blink) */
  body.preload-theme, body.preload-theme * {
    transition: none !important;
  }

  body.light-mode {
    background-color: #f1f5f9 !important; /* slate-100 */
    color: #1e293b !important; /* slate-800 */
  }

  /* Kaca Default (Termasuk Login & Modal tak terduga) - Tetap Milky/Susu */
  .light-mode .glass {
    background: rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6) !important;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01) !important;
  }

  /* ZETTBOT FIX: 1. Clear Glass (Kaca Bening) KHUSUS Area Dashboard & Aplikasi */
  /* Diisolasi dengan ketat agar halaman Login tidak ikut berubah */
  .light-mode #app-container .glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      border-right-color: rgba(255, 255, 255, 0.4) !important;
      border-bottom-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05) !important;
  }

  /* ZETTBOT FIX: 2. Menghidupkan Warna Biasan (Orb Pastel) di Latar Belakang */
  .light-mode .fixed.-z-10.bg-indigo-600\/20 {
      background-color: rgba(99, 102, 241, 0.4) !important; /* Indigo pastel menyala */
      transform: scale(1.3);
  }
  
  .light-mode .fixed.-z-10.bg-emerald-600\/10 {
      background-color: rgba(236, 72, 153, 0.3) !important; /* Hijau diubah jadi Pink pastel agar mirip referensi */
      transform: scale(1.3) translate(-10%, -10%);
  }

  /* Override Background Gelap Bawaan Tailwind */
  .light-mode .bg-slate-900,

  .light-mode .bg-slate-900\/90,

  }

  /* Override Teks Gelap Bawaan Tailwind (Dikembalikan agar Sidebar aman) */

  }

  /* ZETTBOT FIX: Memperbaiki Teks Pudar di Light Mode */

  }
  
  /* Memaksa elemen pudar di Dark Mode menjadi lebih solid di Light Mode agar bisa dibaca */

  .light-mode .opacity-30,

  /* ZETTBOT FIX: Memperbaiki Ikon Kalender Gelap (Native Date Picker) di Light Mode */

      filter: invert(0) opacity(0.6) !important;
  }
  .light-mode input[type="date"]::-webkit-calendar-picker-indicator:hover {

  }
