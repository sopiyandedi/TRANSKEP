  <!-- TRANSKEP: Instant Anti-FOUC Session Guard (0ms Auth State Resolution) -->
  <script>
    (function () {
      try {
        var nip = localStorage.getItem('transkep_active_nip');
        var token = localStorage.getItem('transkep_session_token');
        if (nip && token) {
          document.documentElement.classList.add('app-authenticated');
        } else {
          document.documentElement.classList.add('app-unauthenticated');
        }
      } catch (e) { }
    })();
  </script>

  <!-- TRANSKEP: Auto-Bust PWA Cache & Stale Service Worker Guard -->
  <script>
    (async function () {
      const CURRENT_APP_BUILD = 'transkep-v3.3.8';
      if (localStorage.getItem('transkep_active_build') !== CURRENT_APP_BUILD) {
        localStorage.setItem('transkep_active_build', CURRENT_APP_BUILD);
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => {
              if (k !== CURRENT_APP_BUILD) return caches.delete(k);
            }));
          }
        } catch (e) { }
      }
    })();
  </script>

        'modules/sk/sk_data.js',
        'modules/sop/sop_data.js',
        'modules/kinerja/kinerja_data.js',
        'modules/eoffice/eoffice_data.js',
        'modules/pegawai/pegawai_data.js'
      ];

      const CONTROLLER_SCRIPTS = [
        'modules/dashboard/dashboard.js',
        'modules/dashboard/dashboard_grafik.js',
        'modules/permohonan/cuti.js',
        'modules/permohonan/st.js',
        'modules/permohonan/persetujuan.js',
        'modules/permohonan/magic_approval.js',
        'modules/permohonan/rekapitulasi.js',
        'modules/permohonan/ip.js',
        'modules/permohonan/ik.js',
        'modules/permohonan/wfh.js',
        'modules/pkp/pkp.js',
        'modules/jobdes/jobdes.js',
        'modules/sk/sk_builder.js',
        'modules/sk/sk.js',
        'modules/sop/sop.js',
        'modules/pdf_viewer/pdf_viewer.js',
        'modules/kinerja/kinerja.js',
        'modules/eoffice/eoffice.js',
        'modules/eoffice/kgb.js',
        'modules/eoffice/rapat.js',
        'modules/pegawai/pegawai.js',
        'modules/referensi/referensi.js'
      ];

      const CETAK_SCRIPTS = [
        'modules/permohonan/cetak/cetak_cuti.js',
        'modules/permohonan/cetak/cetak_st.js',
        'modules/permohonan/cetak/cetak_spd.js',
        'modules/permohonan/cetak/cetak_plh.js',
        'modules/jobdes/cetak/cetak_jobdes.js',
        'modules/pkp/cetak/cetak_pk.js',
        'modules/pkp/cetak/cetak_pck.js',
        'modules/pkp/cetak/cetak_rekap_pkp.js',
        'modules/permohonan/cetak/cetak_ip.js',
        'modules/permohonan/cetak/cetak_ik.js',
        'modules/permohonan/cetak/cetak_wfh_rencana.js',
        'modules/permohonan/cetak/cetak_wfh_laporan.js'
      ];

      try {
        const APP_BUILD_VER = '3.5.6';
        console.log('🔄 [TRANSKEP Loader] Memuat komponen tampilan views/ secara paralel...');
        await Promise.all(VIEW_SLOTS.map(async item => {
          const res = await fetch(item.file + '?v=' + APP_BUILD_VER);
          if (!res.ok) throw new Error(`HTTP ${res.status} saat memuat ${item.file}`);
          const html = await res.text();
          const el = document.getElementById(item.slot);
          if (el) el.outerHTML = html;
        }));

        console.log('🔄 [TRANSKEP Loader] Memuat 12 template cetak views/cetak/ secara paralel...');
        const cetakSlot = document.getElementById('slot-templates-cetak');
        if (cetakSlot) {
          const cetakHtmls = await Promise.all(CETAK_TEMPLATES.map(async file => {
            const res = await fetch(file + '?v=' + APP_BUILD_VER);
            if (!res.ok) throw new Error(`HTTP ${res.status} saat memuat ${file}`);
            return await res.text();
          }));
          cetakSlot.outerHTML = cetakHtmls.join('\n');
        }
        console.log('✅ [TRANSKEP Loader] Seluruh 16 komponen views/ & 12 template cetak sukses dimuat ke DOM.');

        const loadScript = (src) => new Promise((resolve) => {
          const s = document.createElement('script');
          s.src = src + '?v=' + APP_BUILD_VER;
          s.onload = resolve;
          s.onerror = (e) => {
            console.error(`Gagal memuat script: ${src}`, e);
            resolve();
          };
          document.body.appendChild(s);
        });

        console.log('🔄 [TRANSKEP Loader] Memuat Core JavaScript secara berurutan...');
        for (const src of CORE_SCRIPTS) {
          await loadScript(src);
        }

        console.log('🔄 [TRANSKEP Loader] Memuat Data Services secara paralel...');
        await Promise.all(DATA_SCRIPTS.map(loadScript));

        console.log('🔄 [TRANSKEP Loader] Memuat Controller & Cetak Handlers secara paralel...');
        await Promise.all([...CONTROLLER_SCRIPTS, ...CETAK_SCRIPTS].map(loadScript));
        console.log('✅ [TRANSKEP Loader] Seluruh script controller & print handlers aktif.');

        // Picu event DOMContentLoaded dan load buatan agar seluruh modul menginisialisasi Vue
        console.log('🚀 [TRANSKEP] Menginisialisasi event DOMContentLoaded aplikasi...');
        document.dispatchEvent(new Event('DOMContentLoaded'));
        window.dispatchEvent(new Event('load'));

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
          // Bersihkan registrasi service worker lama yang tersangkut di scope /transkep-web/
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let reg of registrations) {
              if (reg.scope && reg.scope.includes('/transkep-web')) {
                reg.unregister().then(() => console.log('🧹 [PWA] Service Worker scope /transkep-web/ berhasil dibersihkan'));
              }
            }
          }).catch(() => {});

          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('📱 TRANSKEP PWA: Service Worker terdaftar (Scope:', reg.scope, ')');
              if (reg.update) reg.update();
            })
            .catch(err => console.warn('⚠️ TRANSKEP PWA: Registrasi Service Worker gagal:', err));
        }

      } catch (err) {
        console.error('❌ [TRANSKEP Loader] Terjadi kesalahan inisialisasi:', err);
      }
    })();
  </script>

</body>
