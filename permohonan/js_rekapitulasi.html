<script>
  // ==========================================
  // LOGIKA CLIENT-SIDE: REKAPITULASI HISTORI
  // ==========================================
  
  function showCustomDropdown() {
     const input = document.getElementById('customSearchInput');
     // ZETTBOT FIX: Auto-Clear agar kursor langsung berkedip dan user siap ngetik!
     if (input.value === 'Semua Pegawai') {
         input.value = '';
     }
     
     const list = document.getElementById('customDropdownList');
     list.classList.remove('hidden'); list.classList.add('flex');
     filterCustomDropdown(); 
  }

  function hideCustomDropdown() {
     const list = document.getElementById('customDropdownList');
     list.classList.add('hidden'); list.classList.remove('flex');
     
     const input = document.getElementById('customSearchInput');
     if (input.value.trim() === '') {
         input.value = 'Semua Pegawai';
         document.getElementById('rekapFilterUser').value = 'all';
         document.getElementById('btnCustomSearchClear').classList.add('hidden');
         filterRekap();
     }
  }

  function filterCustomDropdown() {
     const input = document.getElementById('customSearchInput');
     const btnClear = document.getElementById('btnCustomSearchClear');
     
     let rawValue = input.value;
     let filter = rawValue.toLowerCase();

     // ZETTBOT FIX: Munculkan tombol X secara dinamis jika ada teks apa pun
     if (rawValue.trim() !== '') btnClear.classList.remove('hidden');
     else btnClear.classList.add('hidden');

     if (filter === 'semua pegawai') filter = ''; 

     const options = document.getElementById('customOptionsContainer').getElementsByTagName('div');
     for (let i = 0; i < options.length; i++) {
         const text = options[i].textContent || options[i].innerText;
         if (text.toLowerCase().indexOf(filter) > -1) options[i].style.display = "";
         else options[i].style.display = "none";
     }
  }

  // ZETTBOT FIX: Fungsi baru untuk membersihkan teks dan mengembalikan fokus
  function clearCustomSearch(e) {
     e.preventDefault(); // Mencegah onblur mematikan dropdown prematur
     
     const input = document.getElementById('customSearchInput');
     input.value = ''; // Kosongkan sepenuhnya
     document.getElementById('rekapFilterUser').value = 'all';
     document.getElementById('btnCustomSearchClear').classList.add('hidden');
     
     filterCustomDropdown();
     filterRekap();
     
     // Kembalikan kursor ke posisi siap ketik
     input.focus();
  }

  function selectCustomOption(val, text) {
     const cleanText = text.split(' (')[0]; 
     const input = document.getElementById('customSearchInput');
     
     input.value = (val === 'all') ? 'Semua Pegawai' : cleanText;
     document.getElementById('rekapFilterUser').value = val;
     
     if (val !== 'all') document.getElementById('btnCustomSearchClear').classList.remove('hidden');
     else document.getElementById('btnCustomSearchClear').classList.add('hidden');
     
     const list = document.getElementById('customDropdownList');
     list.classList.add('hidden'); list.classList.remove('flex');
     
     filterRekap(); 
  }

  function renderRekapitulasiView() {
    const optContainer = document.getElementById('customOptionsContainer');
    const containerFilterUser = document.getElementById('containerFilterUser');
    const containerFilterJenis = document.getElementById('containerFilterJenis');
    const btnCetakRekap = document.getElementById('btnCetakRekap');
    const adminActions = document.getElementById('rekapAdminActions');
    
    optContainer.innerHTML = `<div onclick="selectCustomOption('all', 'Semua Pegawai')" class="px-3 py-2 text-xs text-slate-300 hover:bg-indigo-600 hover:text-white cursor-pointer transition">Semua Pegawai</div>`;

    state.usersList.forEach(u => {
      // ZETTBOT FIX: Hilangkan role Admin dan Operator dari daftar dropdown Saring Pegawai
      if (u.role !== 'Admin' && u.role !== 'Operator') {
          optContainer.innerHTML += `<div onclick="selectCustomOption('${u.nip}', '${u.nama} (${u.jabatan})')" class="px-3 py-2 text-xs text-slate-300 hover:bg-indigo-600 hover:text-white cursor-pointer transition border-t border-slate-700/50">${u.nama} <span class="text-[9px] text-slate-400 block">${u.jabatan}</span></div>`;
      }
    });

    const isAdmin = state.user && (state.user.role === 'Admin' || state.user.role === 'Operator');

    if (isAdmin) {
       // Tampilan Jika Admin
       if (containerFilterUser) { containerFilterUser.className = 'relative lg:col-span-4'; }
       if (containerFilterJenis) containerFilterJenis.classList.remove('hidden');
       if (btnCetakRekap) btnCetakRekap.classList.remove('hidden');
       if (adminActions) adminActions.classList.remove('hidden');
       
       const trHeader = document.getElementById('trRekapHeader');
       if(trHeader && !document.getElementById('thAksiRekap')) {
           trHeader.insertAdjacentHTML('beforeend', '<th id="thAksiRekap" class="p-4 text-center no-print w-32">Aksi Kontrol</th>');
       }
    } else {
       // Tampilan Jika Pegawai Biasa (Lebarkan kolom saring nama)
       if (containerFilterUser) { containerFilterUser.className = 'relative lg:col-span-8'; }
       if (containerFilterJenis) containerFilterJenis.classList.add('hidden');
       if (btnCetakRekap) btnCetakRekap.classList.add('hidden');
       if (adminActions) adminActions.classList.add('hidden');
    }

    document.getElementById('rekapFilterStart').value = "";
    document.getElementById('rekapFilterEnd').value = "";
    document.getElementById('customSearchInput').value = "Semua Pegawai";
    document.getElementById('rekapFilterUser').value = "all";
    if(document.getElementById('rekapFilterJenis')) document.getElementById('rekapFilterJenis').value = "all";
    document.getElementById('btnCustomSearchClear').classList.add('hidden');
    
    filterRekap();
  }

  function filterRekap() {
    const targetNip = document.getElementById('rekapFilterUser').value;
    const startVal = document.getElementById('rekapFilterStart').value;
    const endVal = document.getElementById('rekapFilterEnd').value;
    const targetJenis = document.getElementById('rekapFilterJenis') ? document.getElementById('rekapFilterJenis').value : 'all';

    const tbody = document.getElementById('tblRekapBody');
    tbody.innerHTML = "";

    const isAdmin = state.user && (state.user.role === 'Admin' || state.user.role === 'Operator');

    if (!startVal && !endVal) {
      const colspan = isAdmin ? 7 : 6;
      tbody.innerHTML = `
        <tr>
          <td colspan="${colspan}" class="text-center p-16 text-slate-500">
            <i class="fa-regular fa-calendar-days text-4xl mb-4 text-slate-600"></i>
            <h4 class="font-bold text-slate-400 text-sm tracking-wide uppercase">Pilih rentang tanggal yang ingin Anda ketahui</h4>
            <p class="text-xs mt-2 text-slate-500 max-w-sm mx-auto leading-relaxed">Silakan tentukan <span class="font-bold text-slate-300">Dari Tanggal</span> dan <span class="font-bold text-slate-300">Sampai Tanggal</span> terlebih dahulu untuk menampilkan rekapitulasi data.</p>
          </td>
        </tr>
      `;
      return;
    }

    let combinedData = [];

    // 1. MASUKKAN DATA CUTI LAMA
    if (state.cutiLogs) {
        state.cutiLogs.forEach(log => combinedData.push(Object.assign({}, log, { z_type: 'Cuti' })));
    }
    
    // 2. MASUKKAN DATA SURAT TUGAS (ST)
    if (state.stList) {
        state.stList.forEach(st => {
            let pesertaArr = [];
            try { pesertaArr = JSON.parse(st.peserta); } catch(e) {}
            
            pesertaArr.forEach(p => {
                combinedData.push({
                    is_st: true, id: st.id, nip: String(p.nip), tgl_pengajuan: st.waktu ? st.waktu.split(' ')[0] : '-',
                    jenis: 'Dinas Luar', tgl_mulai: st.tgl_mulai, tgl_selesai: st.tgl_selesai,
                    alasan: st.tujuan + " (di " + st.tempat + ")", status: 'Disetujui',
                    get_spd: p.get_spd || false, plh_nip: p.plh_nip || ""
                });
            });
        });
    }

    // 3. MASUKKAN DATA IZIN KELUAR (IK)
    if (state.ikLogs) {
        state.ikLogs.forEach(log => {
            combinedData.push({
                z_type: 'IK', id: log.id, nip: String(log.nip), tgl_pengajuan: log.tgl_pengajuan,
                jenis: 'Izin Keluar Kantor', tgl_mulai: log.tanggal, tgl_selesai: log.tanggal,
                alasan: log.alasan + ` (Jam: ${log.jam_keluar} - ${log.jam_kembali})`, status: log.status
            });
        });
    }

    // 4. MASUKKAN DATA IZIN PRIBADI (IP)
    if (state.ipLogs) {
        state.ipLogs.forEach(log => {
            combinedData.push({
                z_type: 'IP', id: log.id, nip: String(log.nip), tgl_pengajuan: log.tgl_pengajuan,
                jenis: 'Izin Pribadi', tgl_mulai: log.tgl_mulai, tgl_selesai: log.tgl_selesai,
                alasan: log.alasan, status: log.status
            });
        });
    }

    // 5. MASUKKAN DATA WFH
    if (state.wfhLogs) {
        state.wfhLogs.forEach(log => {
            let ringkasan = "Detail WFH ada di dokumen PDF";
            let finalStatus = log.status_rencana;
            
            if (log.status_rencana === 'Disetujui') {
                if (!log.status_laporan || log.status_laporan === 'Belum Lapor') finalStatus = 'Isi Laporan';
                else if (log.status_laporan === 'Menunggu') finalStatus = 'Laporan Diperiksa';
                else finalStatus = log.status_laporan; // Disetujui or Ditolak
            }

            try {
                let isLaporan = (finalStatus === 'Laporan Diperiksa' || finalStatus === 'Disetujui' || finalStatus === 'Ditolak') && log.laporan_json;
                let jsonTarget = isLaporan ? log.laporan_json : log.rencana_json;
                
                let targetList = JSON.parse(jsonTarget || '[]');
                ringkasan = targetList.map((t, idx) => {
                    if (isLaporan) return `${idx+1}. ${t.deskripsi} [Hasil: ${t.realisasi}]`;
                    return `${idx+1}. ${t.deskripsi} [Target Qty: ${t.kuantitas}]`;
                }).join(', ');
            } catch(e) {}

            combinedData.push({
                z_type: 'WFH', id: log.id, nip: String(log.nip), tgl_pengajuan: log.tgl_pengajuan,
                jenis: 'Work From Home', tgl_mulai: log.tanggal, tgl_selesai: log.tanggal,
                alasan: ringkasan, status: finalStatus, wfh_rencana: log.status_rencana, wfh_laporan: log.status_laporan
            });
        });
    }

    let filtered = combinedData;

    // FILTER BERDASARKAN NAMA & TANGGAL
    if (targetNip !== 'all') {
      filtered = filtered.filter(log => String(log.nip) === String(targetNip));
    }

    // ZETTBOT FIX: Filter Berdasarkan Jenis Izin
    if (targetJenis !== 'all') {
        filtered = filtered.filter(log => {
            if (targetJenis === 'Tahunan' || targetJenis === 'Sakit' || targetJenis === 'Alasan Penting' || targetJenis === 'Melahirkan' || targetJenis === 'Besar' || targetJenis === 'CLTN') {
                return log.z_type === 'Cuti' && log.jenis === targetJenis;
            }
            return log.jenis === targetJenis;
        });
    }

    if (startVal || endVal) {
      let filterStart = startVal ? new Date(startVal) : new Date(endVal);
      let filterEnd = endVal ? new Date(endVal) : new Date(startVal);
      
      filterStart.setHours(0,0,0,0);
      filterEnd.setHours(23,59,59,999);

      filtered = filtered.filter(log => {
         if(!log.tgl_mulai || !log.tgl_selesai) return false;
         let logStart = new Date(log.tgl_mulai); logStart.setHours(0,0,0,0);
         let logEnd = new Date(log.tgl_selesai); logEnd.setHours(23,59,59,999);
         return (logStart <= filterEnd) && (logEnd >= filterStart);
      });
    }

    // Urutkan dari yang paling baru
    filtered.sort((a, b) => new Date(b.tgl_mulai) - new Date(a.tgl_mulai));

    if (filtered.length === 0) {
      const colspan = isAdmin ? 7 : 6;
      tbody.innerHTML = `<tr><td colspan="${colspan}" class="text-center p-8 text-slate-600">Tidak ada data transaksi izin/dinas yang cocok dengan rentang waktu atau jenis tersebut.</td></tr>`;
      return;
    }

    filtered.forEach(log => {
      const pns = state.usersList.find(u => String(u.nip) === String(log.nip)) || { nama: 'Unknown', jabatan: '-' };
      const tr = document.createElement('tr');
      tr.className = "border-b border-slate-900 hover:bg-slate-900/10 transition text-xs";

      // PEWARNAAN BADGE BERDASARKAN STATUS
      let statusColor = "text-amber-400 border-amber-500/30 bg-amber-500/10";
      if (log.status === 'Disetujui') statusColor = "text-emerald-400 border-emerald-500/30 bg-emerald-500/10";
      else if (log.status === 'Ditolak') statusColor = "text-rose-400 border-rose-500/30 bg-rose-500/10";
      else if (log.status === 'Menunggu Pembatalan') statusColor = "text-purple-400 border-purple-500/30 bg-purple-500/10";
      else if (log.status === 'DIBATALKAN') statusColor = "text-slate-400 border-slate-600 bg-slate-800";
      else if (log.status === 'Isi Laporan') statusColor = "text-amber-400 border-amber-500/50 bg-amber-500/10 border-dashed animate-pulse";
      else if (log.status === 'Laporan Diperiksa') statusColor = "text-sky-400 border-sky-500/30 bg-sky-500/10";

      let alasanText = "*** Rahasia ***";
      let tooltipText = "Anda tidak memiliki hak akses melihat rincian alasan";
      
      if (isAdmin || state.user.role === 'Atasan' || String(state.user.nip) === String(log.nip) || log.jenis === 'Dinas Luar') {
         alasanText = log.alasan;
         tooltipText = log.alasan;
      }

      // RENDER TOMBOL AKSI ADMIN
      let aksiHTML = '';
      if (isAdmin) {
          let btnCetak = '';
          let btnEdit = '';
          let btnHapus = '';
          
          if (log.is_st) {
              btnCetak = `<div class="flex gap-1 justify-center items-center">`;
              btnCetak += `<button onclick="cetakSTDariRekap('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-md transition border border-emerald-500/30 text-[9px] font-bold tracking-wider" title="Cetak Surat Tugas">ST</button>`;
              
              if (log.get_spd) btnCetak += `<button onclick="cetakSPDDariRekap('${log.id}', '${log.nip}')" class="px-2 py-1.5 bg-slate-800 hover:bg-amber-600 text-amber-400 hover:text-white rounded-md transition border border-amber-500/30 text-[9px] font-bold tracking-wider" title="Cetak SPD">SPD</button>`;
              if (log.plh_nip) btnCetak += `<button onclick="cetakPlhDariRekap('${log.id}', '${log.nip}')" class="px-2 py-1.5 bg-slate-800 hover:bg-purple-600 text-purple-400 hover:text-white rounded-md transition border border-purple-500/30 text-[9px] font-bold tracking-wider" title="Cetak Penunjukan Plh">PLH</button>`;
              
              btnCetak += `</div>`;
              btnEdit = `<button onclick="editST('${log.id}')" class="p-2 bg-slate-800 hover:bg-blue-600 text-blue-400 hover:text-white rounded-lg transition border border-blue-500/30 ml-1" title="Edit Data Surat Tugas"><i class="fa-solid fa-gear"></i></button>`;
              btnHapus = `<button onclick="deleteSTRecord('${log.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg transition border border-rose-500/20 ml-1" title="Hapus ST"><i class="fa-solid fa-trash-can"></i></button>`;
          
          } else if (log.z_type === 'IK') {
              btnCetak = `<div class="flex gap-1 justify-center items-center">
                  <button onclick="cetakIzinKeluar('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-sky-600 text-sky-400 hover:text-white rounded-md transition border border-sky-500/30 text-[9px] font-bold tracking-wider" title="Cetak IK">IK</button>
              </div>`;
              btnHapus = `<button onclick="deleteIKFromRekap('${log.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg transition border border-rose-500/20 ml-1" title="Hapus Permanen IK"><i class="fa-solid fa-trash-can"></i></button>`; 

          } else if (log.z_type === 'IP') {
              btnCetak = `<div class="flex gap-1 justify-center items-center">
                  <button onclick="cetakIzinPribadi('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-md transition border border-emerald-500/30 text-[9px] font-bold tracking-wider" title="Cetak IP">IP</button>
              </div>`;
              btnHapus = `<button onclick="deleteIPFromRekap('${log.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg transition border border-rose-500/20 ml-1" title="Hapus Permanen IP"><i class="fa-solid fa-trash-can"></i></button>`; 

          } else if (log.z_type === 'WFH') {
              btnCetak = `<div class="flex gap-1 justify-center items-center">`;
              btnCetak += `<button onclick="cetakRencanaWFH('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-amber-600 text-amber-400 hover:text-white rounded-md transition border border-amber-500/30 text-[9px] font-bold tracking-wider" title="Cetak Rencana WFH">PLAN</button>`;
              
              if (log.wfh_laporan && log.wfh_laporan !== 'Belum Lapor') {
                  btnCetak += `<button onclick="cetakLaporanWFH('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-md transition border border-emerald-500/30 text-[9px] font-bold tracking-wider" title="Cetak Laporan WFH">LAP</button>`;
              }
              btnCetak += `</div>`;
              btnHapus = `<button onclick="deleteWFHFromRekap('${log.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg transition border border-rose-500/20 ml-1" title="Hapus Permanen WFH"><i class="fa-solid fa-trash-can"></i></button>`; 

          } else if (log.z_type === 'Cuti') {
              btnCetak = `<div class="flex gap-1 justify-center items-center">`;
              btnCetak += `<button onclick="printCutiForm('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-indigo-600 text-slate-400 hover:text-white rounded-md transition border border-slate-700 text-[9px] font-bold tracking-wider" title="Cetak Berkas Cuti">CUTI</button>`;
              
              let cutiPlhNip = log.plh_nip || null;
              if (!cutiPlhNip && log.history) {
                 try { let h = JSON.parse(log.history); if(h.plh_nip) cutiPlhNip = h.plh_nip; } catch(e){}
              }

              if (cutiPlhNip) {
                  btnCetak += `<button onclick="cetakPlhCutiTahap2('${log.id}', '${log.nip}', '${cutiPlhNip}')" class="px-2 py-1.5 bg-slate-800 hover:bg-purple-600 text-purple-400 hover:text-white rounded-md transition border border-purple-500/30 text-[9px] font-bold tracking-wider" title="Cetak Penunjukan Plh Cuti">PLH</button>`;
              }
              btnCetak += `</div>`;

              if(log.status !== 'DIBATALKAN') {
                  btnHapus = `<button onclick="deleteRekapRecord('${log.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg transition border border-rose-500/20 ml-1" title="Batalkan Cuti"><i class="fa-solid fa-trash-can"></i></button>`;
              } else {
                  btnHapus = `<div class="w-[34px] ml-1"></div>`; 
              }
          }
          
          aksiHTML = `<td class="p-4 text-center no-print whitespace-nowrap"><div class="flex items-center justify-center">${btnCetak}${btnEdit}${btnHapus}</div></td>`;
      }

      tr.innerHTML = `
        <td class="p-4">
          <div class="font-bold text-slate-200">${pns.nama}</div>
          <div class="text-slate-500 text-[10px] mt-0.5">NIP: ${log.nip} | ${pns.jabatan}</div>
        </td>
        <td class="p-4">
          <div class="font-mono text-slate-300 font-semibold">${log.id}</div>
          <div class="text-slate-500 text-[10px] mt-0.5">${log.tgl_pengajuan}</div>
        </td>
        <td class="p-4 font-bold text-slate-300">${log.jenis}</td>
        <td class="p-4 text-slate-300">
          <div>${formatDateIndoRekap(log.tgl_mulai)}</div>
          <div class="text-[10px] text-slate-500">s.d ${formatDateIndoRekap(log.tgl_selesai)}</div>
        </td>
        <td class="p-4 text-slate-400 max-w-[250px] truncate" title="${tooltipText}">${alasanText}</td>
        <td class="p-4">
          <span class="inline-flex px-2 py-0.5 rounded-md text-[10px] font-bold border ${statusColor} uppercase tracking-wider">${log.status}</span>
        </td>
        ${aksiHTML}
      `;
      tbody.appendChild(tr);
    });
  }

  function formatDateIndoRekap(dateStr) {
      if (!dateStr) return "-";
      const parts = dateStr.split('-');
      if (parts.length === 3) {
          const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
          return `${parseInt(parts[2], 10)} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
      }
      return dateStr;
  }

  function cetakRekap() {
      const startVal = document.getElementById('rekapFilterStart').value;
      const endVal = document.getElementById('rekapFilterEnd').value;
      
      if (!startVal && !endVal) {
          showNotify("Tidak Dapat Mencetak", "Silakan pilih rentang tanggal (Dari / Sampai) terlebih dahulu untuk memunculkan data.", "error");
          return;
      }
      window.print();
  }

  function deleteRekapRecord(id) {
    showCustomConfirm("Batalkan Cuti", "Apakah Anda yakin ingin membatalkan cuti ini? Statusnya akan berubah menjadi DIBATALKAN dan saldo cuti akan dikembalikan utuh ke pegawai terkait.", function() {
      showLoading("Membatalkan data...");
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.status === 'success') {
            showNotify("Berhasil Dibatalkan", res.message, "success");
            if (state && state.cutiLogs) {
                const logIndex = state.cutiLogs.findIndex(function(l) { return String(l.id) === String(id); });
                if (logIndex !== -1) {
                    state.cutiLogs[logIndex].status = 'DIBATALKAN';
                    state.cutiLogs[logIndex].status_atasan = 'DIBATALKAN';
                    state.cutiLogs[logIndex].status_pejabat = 'DIBATALKAN';
                    filterRekap();
                }
            }
          } else { showNotify("Gagal Membatalkan", res.message, "error"); }
        })
        .withFailureHandler(function(err) { hideLoading(); showNotify("Error", err.toString(), "error"); })
        .deleteCutiLog(id, true);
    });
  }

  function deleteSTRecord(id) {
    showCustomConfirm("Hapus Surat Tugas", "Apakah Anda yakin ingin menghapus dokumen Surat Tugas ini? Semua nama pegawai yang tergabung dalam rombongan dinas ini akan ikut terhapus riwayatnya.", function() {
      showLoading("Menghapus Surat Tugas...");
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.status === 'success') {
            showNotify("Surat Tugas Dihapus", res.message, "success");
            
            if (state && state.stList) {
                const logIndex = state.stList.findIndex(function(l) { return String(l.id) === String(id); });
                if (logIndex !== -1) {
                    state.stList.splice(logIndex, 1);
                    filterRekap(); 
                }
            }
          } else { 
            showNotify("Gagal Menghapus", res.message, "error");
