<!-- =========================================================================
     ZETTBOS MODULAR UI: JAVASCRIPT CETAK IZIN KELUAR
========================================================================== -->
<script>
    function cetakIzinKeluar(id) {
        if (window.isGlobalPrinting) {
            showNotify("Proses Sibuk", "Sistem sedang menyiapkan dokumen. Harap tunggu.", "warning");
            return; 
        }

        if (!state || !state.user) {
            showNotify("Sistem Memuat", "Data belum siap.", "warning");
            return;
        }
        
        window.isGlobalPrinting = true;
        showLoading("Menyiapkan dokumen Izin Keluar...");
        
        if (typeof google !== 'undefined') {
            google.script.run
                .withSuccessHandler(function(res) {
                    if (res.status === 'success') {
                        renderTemplateCetakIK(res.data);
                    } else {
                        hideLoading();
                        window.isGlobalPrinting = false;
                        showNotify("Gagal", res.message, "error");
                    }
                })
                .withFailureHandler(function(err) {
                    hideLoading();
                    window.isGlobalPrinting = false;
                    showNotify("Error Koneksi", err.toString(), "error");
                })
                .getIzinKeluarById(id);
        } else {
            setTimeout(() => {
                hideLoading();
                window.isGlobalPrinting = false;
                alert("[CANVAS MODE] Simulasi cetak IK untuk ID: " + id);
            }, 1000);
        }
    }
    
    function renderTemplateCetakIK(data) {
        try {
            const pemohon = state.usersList.find(u => String(u.nip) === String(data.nip)) || { nama: 'Tidak Diketahui', jabatan: '-' };
            const atasan = state.usersList.find(u => String(u.nip) === String(data.atasan_nip)) || { nama: 'Tidak Diketahui', jabatan: '-' };
            
            document.getElementById('cetakIkId').innerText = data.id;
            document.getElementById('cetakIkNama').innerText = pemohon.nama;
            document.getElementById('cetakIkNip').innerText = data.nip;
            document.getElementById('cetakIkJabatan').innerText = pemohon.jabatan;
            
            document.getElementById('cetakIkTanggal').innerText = formatDateIndoRekap(data.tanggal);
            document.getElementById('cetakIkJamKeluar').innerText = data.jam_keluar + " WIB";
            
            document.getElementById('cetakIkJamKembali').innerText = (data.jam_kembali && data.jam_kembali !== "-") ? data.jam_kembali + " WIB" : "Tidak Kembali ke Kantor";
            document.getElementById('cetakIkAlasan').innerText = data.alasan;
            
            const tglBuat = data.waktu ? data.waktu.split(' ')[0] : '-';
            document.getElementById('cetakIkTanggalBuat').innerText = formatDateIndoRekap(tglBuat);
            
            document.getElementById('cetakIkNamaPemohon').innerText = pemohon.nama;
            document.getElementById('cetakIkNipPemohon').innerText = data.nip;
            
            document.getElementById('cetakIkNamaAtasan').innerText = atasan.nama;
            document.getElementById('cetakIkNipAtasan').innerText = data.atasan_nip;
            
            const printArea = document.getElementById('printAreaIK');
            
            document.querySelectorAll('.print-only').forEach(el => {
                el.classList.add('hidden');
                el.style.display = 'none';
            });

            if(printArea) {
                printArea.classList.remove('hidden');
                printArea.style.display = 'none';
            }
            
            setTimeout(() => {
                hideLoading();
                window.focus();
                window.print();
                
                setTimeout(() => {
                    if(printArea) {
                        printArea.classList.add('hidden');
                        printArea.style.display = '';
                    }
                    window.isGlobalPrinting = false;
                }, 1500);
            }, 800);
            
        } catch(e) {
            hideLoading();
            window.isGlobalPrinting = false;
            showNotify("Error Render", "Terjadi kesalahan saat memuat template cetak IK.", "error");
            console.error(e);
        }
    }
</script>
