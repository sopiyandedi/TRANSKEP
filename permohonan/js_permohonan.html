
  // =========================================================================
  // FILE: js_permohonan.html
  // DESKRIPSI: Fungsi Helper/Core Khusus Modul Permohonan (Code Pruning)
  // =========================================================================

  <script>
document.addEventListener("DOMContentLoaded", () => {
    const { createApp } = Vue;

    window.vmPermohonan = createApp({
        data() {
            return {
                myLogs: [],
                currentUser: null,
                usersList: [],
                showModalCuti: false,
                isEditMode: false,
                formCuti: this.getEmptyForm(),
                atasanOptions: [],
                pejabatOptions: [],
                uploadedFile: null
            };
        },
        methods: {
            // Jembatan sinkronisasi dengan Vanilla JS State
            syncData(globalState) {
                if (!globalState || !globalState.user) return;
                this.currentUser = globalState.user;
                this.usersList = globalState.usersList;
                
                const myNipClean = String(this.currentUser.nip || '').replace(/[^0-9]/g, '');
                this.myLogs = (globalState.cutiLogs || [])
                    .filter(l => String(l.nip || '').replace(/[^0-9]/g, '') === myNipClean)
                    .map(l => {
                        let idSort = 0;
                        if (l.id) {
                            const parts = String(l.id).split('-');
                            idSort = parseInt(parts[1] || parts[0]) || 0;
                        }
                        return { ...l, z_sort: idSort };
                    })
                    .sort((a, b) => b.z_sort - a.z_sort);
            },
            
            getEmptyForm() {
                return { id: null, jenis: 'Tahunan', tgl_mulai: '', tgl_selesai: '', alasan: '', alamat: '', atasan_nip: '', pejabat_nip: '', plh_nip: '' };
            },

            getStatusColor(status) {
                if (status === 'Disetujui') return "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
                if (status === 'Ditolak') return "text-rose-400 bg-rose-500/10 border-rose-500/20";
                if (status === 'DIBATALKAN') return "text-slate-400 bg-slate-800 border-slate-700";
                return "text-amber-400 bg-amber-500/10 border-amber-500/20"; // Menunggu
            },

            openFormModal(isEdit = false) {
                this.isEditMode = isEdit;
                if (!isEdit) {
                    this.formCuti = this.getEmptyForm();
                    this.formCuti.alamat = this.currentUser.alamat || "";
                }
                
                // Gunakan fungsi setup hierarki bawaan (diadaptasi ke Vue)
                this.setupHierarchyOptions();
                this.uploadedFile = null;
                this.showModalCuti = true;
            },

            closeFormModal() {
                this.showModalCuti = false;
                this.formCuti = this.getEmptyForm();
            },

            editCuti(logData) {
                this.formCuti = { ...logData };
                this.openFormModal(true);
            },

            handleFileUpload(event) {
                const file = event.target.files[0];
                if (file && file.size > 2 * 1024 * 1024) {
                    window.showNotify("File Besar", "Maksimal 2MB.", "error");
                    event.target.value = '';
                    this.uploadedFile = null;
                    return;
                }
                this.uploadedFile = file;
            },

            setupHierarchyOptions() {
                // Sederhanakan logika pencarian atasan/pejabat sesuai hierarki (adaptasi dari setupAtasanAndPejabat Vanilla)
                // Sementara isi semua pegawai kecuali diri sendiri sebagai opsi fallback.
                this.atasanOptions = this.usersList.filter(u => String(u.nip) !== String(this.currentUser.nip));
                this.pejabatOptions = this.usersList.filter(u => String(u.nip) !== String(this.currentUser.nip));
                
                if(this.atasanOptions.length > 0 && !this.formCuti.atasan_nip) this.formCuti.atasan_nip = this.atasanOptions[0].nip;
                if(this.pejabatOptions.length > 0 && !this.formCuti.pejabat_nip) this.formCuti.pejabat_nip = this.pejabatOptions[0].nip;
            },

            async submitCuti() {
                let fileData = null, fileName = null, fileMimeType = null;
                
                if (this.formCuti.jenis !== 'Tahunan' && this.uploadedFile) {
                    window.showLoading("Membaca dokumen lampiran...");
                    const base64Str = await window.readFileAsBase64(this.uploadedFile);
                    fileData = base64Str.split(',')[1];
                    fileName = this.uploadedFile.name;
                    fileMimeType = this.uploadedFile.type;
                } else if (this.formCuti.jenis !== 'Tahunan' && !this.isEditMode) {
                    window.showNotify("Validasi", "Bukti dukung wajib dilampirkan!", "error");
                    return;
                }

                const payload = {
                    ...this.formCuti,
                    nip: this.currentUser.nip,
                    fileData, fileName, fileMimeType
                };

                const token = localStorage.getItem('transkep_session_token');
                window.showLoading("Mengirimkan usulan cuti...");

                const runner = google.script.run
                  .withSuccessHandler((res) => {
                      window.hideLoading();
                      this.closeFormModal();
                      if (res.status === 'success') {
                          window.showNotify("Berhasil Disimpan", res.message, "success");
                          // Panggil ulang sinkronisasi Vanilla agar state global terbaru didapat
                          if (typeof window.syncAllServerData === 'function') window.syncAllServerData(true);
                      } else {
                          window.showNotify("Gagal", res.message, "error");
                      }
                  })
                  .withFailureHandler((err) => {
                      window.hideLoading();
                      window.showNotify("Error Koneksi", err.toString(), "error");
                  });

                // Eksekusi Pintu: Edit atau Add Baru
                if (payload.id) runner.updateCutiLog(payload, this.currentUser.nip, token);
                else runner.addCutiLog(payload, this.currentUser.nip, token);
            },

            deleteCutiRecord(id) {
                // Panggil fungsi Vanilla yang lama agar logika pembatalan tetap aman
                if (typeof window.deleteCutiRecord === 'function') {
                    window.deleteCutiRecord(id);
                }
            },
            
            printCuti(id) {
                if (typeof window.printCutiForm === 'function') window.printCutiForm(id);
            }
        }
    }).mount('#vue-permohonan-app');
});

// OVERRIDE: Fungsi render bawaan Vanilla JS sekarang bertugas memompa data ke Vue
window.renderPermohonanView = function() {
    if (window.vmPermohonan && window.state) {
        window.vmPermohonan.syncData(window.state);
        
        // Panggil notifikasi badge bawaan jika ada
        if (typeof updateBadgePermohonan === 'function') updateBadgePermohonan();
    }
};
</script>
