<script>
  // =========================================================================
  // LOGIKA CLIENT-SIDE: PERMOHONAN CUTI & BYPASS
  // =========================================================================

  let isBypassMode = false;

  function switchCutiTab(tabId) {
      document.querySelectorAll('.cuti-tab-content').forEach(function(el) {
          el.classList.add('hidden');
          el.classList.remove('block'); 
          el.style.opacity = '0';
          el.style.transition = 'none';
      });
      
      const targetContent = document.getElementById('tab-' + tabId);
      if (targetContent) {
          targetContent.classList.remove('hidden');
          targetContent.classList.add('block');
          
          setTimeout(() => {
              targetContent.style.transition = 'opacity 0.4s ease-in-out';
              targetContent.style.opacity = '1';
          }, 20);
      }

      const tabs = ['riwayat', 'verifikasi', 'rekapitulasi'];
      tabs.forEach(function(id) {
          const btn = document.getElementById('btn-tab-' + id);
          if (!btn) return;
          
          if (id === tabId) {
              btn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
              btn.classList.remove('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800');
          } else {
              btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
              btn.classList.add('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800');
          }
      });
      
      if (tabId === 'verifikasi' && typeof renderPersetujuanView === 'function') renderPersetujuanView();
      if (tabId === 'rekapitulasi' && typeof renderRekapitulasiView === 'function') renderRekapitulasiView();
  }

  function renderPermohonanView() {
    try {
      const btnVerifikasi = document.getElementById('btn-tab-verifikasi');
      if (state && state.user && btnVerifikasi) {
          const myRole = state.user.role;
          if (['Admin', 'Operator', 'Atasan Langsung', 'Pejabat Berwenang'].includes(myRole)) {
              btnVerifikasi.classList.remove('hidden');

              let pendingCount = 0;
              const myNip = String(state.user.nip);

              // 1. Hitung Notifikasi Cuti
              if (state.cutiLogs) {
                  state.cutiLogs.forEach(function(log) {
                      if (log.status !== 'Menunggu' && log.status !== 'Menunggu Pembatalan') return; 
                      
                      if (myRole === 'Admin' || myRole === 'Operator') {
                          pendingCount++;
                      } else if (log.status === 'Menunggu Pembatalan' && String(log.pejabat_nip) === myNip) {
                          pendingCount++; 
                      } else if (log.status === 'Menunggu') {
                          let isAtasan = (String(log.atasan_nip) === myNip);
                          let isPejabat = (String(log.pejabat_nip) === myNip);
                          
                          if (isAtasan && isPejabat && log.status_atasan === 'Menunggu') pendingCount++;
                          else if (isAtasan && log.status_atasan === 'Menunggu') pendingCount++;
                          else if (isPejabat && log.status_pejabat === 'Menunggu' && log.status_atasan === 'Disetujui') pendingCount++;
                      }
                  });
              }

              // 2. Hitung Notifikasi IK
              if (state.ikLogs) {
                  state.ikLogs.forEach(function(log) {
                      if ((myRole === 'Admin' || myRole === 'Operator') && log.status === 'Menunggu') pendingCount++;
                      else if (log.status === 'Menunggu' && String(log.atasan_nip) === myNip) pendingCount++;
                  });
              }

              // 3. Hitung Notifikasi IP
              if (state.ipLogs) {
                  state.ipLogs.forEach(function(log) {
                      if ((myRole === 'Admin' || myRole === 'Operator') && log.status === 'Menunggu') pendingCount++;
                      else if (log.status === 'Menunggu' && String(log.atasan_nip) === myNip) pendingCount++;
                  });
              }

              // 4. Hitung Notifikasi WFH (Rencana & Laporan)
              if (state.wfhLogs) {
                  state.wfhLogs.forEach(function(log) {
                      if (myRole === 'Admin' || myRole === 'Operator') {
                          if (log.status_rencana === 'Menunggu' || log.status_laporan === 'Menunggu') pendingCount++;
                      } else {
                          if (log.status_rencana === 'Menunggu' && String(log.atasan_nip) === myNip) pendingCount++;
                          if (log.status_laporan === 'Menunggu' && String(log.atasan_nip) === myNip) pendingCount++;
                      }
                  });
              }

              const badge = document.getElementById('badge-verifikasi');
              if (badge) {
                  if (pendingCount > 0) {
                      badge.innerText = pendingCount;
                      badge.classList.remove('hidden');
                  } else {
                      badge.classList.add('hidden');
                  }
              }
          } else {
              btnVerifikasi.classList.add('hidden');
              const tabVerifikasi = document.getElementById('tab-verifikasi');
              if (tabVerifikasi && !tabVerifikasi.classList.contains('hidden')) switchCutiTab('riwayat');
          }
      }

      const tbody = document.getElementById('tblPermohonanBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (!state || !state.user) return;

      // GABUNGKAN SEMUA LOG KE DALAM SATU ARRAY
      const myLogs = [];
      const myNipStr = String(state.user.nip);
      
      if (state.cutiLogs) {
          state.cutiLogs.filter(l => String(l.nip) === myNipStr).forEach(l => {
              myLogs.push(Object.assign({}, l, { z_type: 'Cuti', z_sort: parseInt(l.id.split('-')[1]) || 0 }));
          });
      }
      if (state.ikLogs) {
          state.ikLogs.filter(l => String(l.nip) === myNipStr).forEach(l => {
              myLogs.push(Object.assign({}, l, { z_type: 'IK', z_sort: parseInt(l.id.split('-')[1]) || 0 }));
          });
      }
      if (state.ipLogs) {
          state.ipLogs.filter(l => String(l.nip) === myNipStr).forEach(l => {
              myLogs.push(Object.assign({}, l, { z_type: 'IP', z_sort: parseInt(l.id.split('-')[1]) || 0 }));
          });
      }
      if (state.wfhLogs) {
          state.wfhLogs.filter(l => String(l.nip) === myNipStr).forEach(l => {
              myLogs.push(Object.assign({}, l, { z_type: 'WFH', z_sort: parseInt(l.id.split('-')[1]) || 0 }));
          });
      }

      // Urutkan dari yang terbaru (ID Timestamp Descending)
      myLogs.sort((a, b) => b.z_sort - a.z_sort);

      if (myLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center p-8 text-slate-600 italic">Belum ada riwayat pengajuan apapun.</td></tr>';
        return;
      }

      myLogs.forEach(function(log, index) {
        let atasan = state.usersList.find(u => u.nip === log.atasan_nip) || { nama: 'Tidak Diketahui' };
        let pejabat = { nama: '-' };

        let jenisText = "";
        let tgl_1 = "", tgl_2 = "";
        let durasiHtml = "";
        let statusAkhir = log.status;
        let statusColor = "text-amber-400 bg-amber-500/10 border-amber-500/20";
        let atasanDot = "text-amber-500";
        let pejabatDot = "text-slate-600";
        
        let btnCetak = "";
        let btnBatal = "";
        let btnEdit = "";

        if (log.z_type === 'Cuti') {
            jenisText = log.jenis;
            tgl_1 = log.tgl_mulai; tgl_2 = `s.d ${log.tgl_selesai}`;
            pejabat = state.usersList.find(u => u.nip === log.pejabat_nip) || { nama: 'Tidak Diketahui' };
            durasiHtml = `<span class="inline-flex px-2 py-0.5 rounded border border-indigo-500/20 bg-indigo-500/10 text-indigo-400 text-[10px] font-bold">Durasi: ${log.sisa_cuti || calculateDuration(log.tgl_mulai, log.tgl_selesai)} Hari</span>`;
            
            atasanDot = log.status_atasan === 'Disetujui' ? 'text-emerald-500' : (log.status_atasan === 'Ditolak' ? 'text-rose-500' : 'text-amber-500');
            pejabatDot = log.status_pejabat === 'Disetujui' ? 'text-emerald-500' : (log.status_pejabat === 'Ditolak' ? 'text-rose-500' : 'text-amber-500');
            
            if (log.status === 'Menunggu') {
                btnEdit = `<button onclick="editCuti('${log.id}')" class="px-2 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 border border-indigo-500/20 hover:border-indigo-500 text-indigo-400 hover:text-white rounded-lg transition" title="Ubah Pengajuan"><i class="fa-solid fa-pen-to-square"></i></button>`;
                btnBatal = `<button onclick="deleteCutiRecord('${log.id}')" class="px-2 py-1.5 bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 hover:border-rose-500 text-rose-400 hover:text-white rounded-lg transition" title="Tarik Pengajuan"><i class="fa-regular fa-trash-can"></i></button>`;
            }
            if (log.jenis !== 'Dinas Luar') btnCetak = `<button onclick="printCutiForm('${log.id}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition shadow-md shadow-slate-900/30" title="Cetak Berkas"><i class="fa-solid fa-print text-xs"></i> Cetak</button>`;
        } 
        else if (log.z_type === 'IK') {
            jenisText = "Izin Keluar Kantor";
            tgl_1 = log.tanggal; tgl_2 = `Jam: ${log.jam_keluar} - ${log.jam_kembali}`;
            durasiHtml = `<span class="inline-flex px-2 py-0.5 rounded border border-sky-500/20 bg-sky-500/10 text-sky-400 text-[10px] font-bold">IK (Short Leave)</span>`;
            
            atasanDot = log.status === 'Disetujui' ? 'text-emerald-500' : (log.status === 'Ditolak' ? 'text-rose-500' : 'text-amber-500');
            
            if (log.status === 'Menunggu') {
                btnEdit = `<button onclick="editIK('${log.id}')" class="px-2 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 border border-indigo-500/20 hover:border-indigo-500 text-indigo-400 hover:text-white rounded-lg transition" title="Ubah Pengajuan"><i class="fa-solid fa-pen-to-square"></i></button>`;
                btnBatal = `<button onclick="deleteIK('${log.id}')" class="px-2 py-1.5 bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 hover:border-rose-500 text-rose-400 hover:text-white rounded-lg transition" title="Tarik Pengajuan"><i class="fa-regular fa-trash-can"></i></button>`;
            }
            btnCetak = `<button onclick="cetakIzinKeluar('${log.id}')" class="px-3 py-1.5 bg-sky-900/50 hover:bg-sky-700 text-sky-300 border border-sky-700 rounded-lg transition shadow-md shadow-sky-900/20" title="Cetak IK"><i class="fa-solid fa-print text-xs"></i> Cetak IK</button>`;
        }
        else if (log.z_type === 'IP') {
            jenisText = "Izin Pribadi";
            tgl_1 = log.tgl_mulai; tgl_2 = `s.d ${log.tgl_selesai}`;
            durasiHtml = `<span class="inline-flex px-2 py-0.5 rounded border border-emerald-500/20 bg-emerald-500/10 text-emerald-400 text-[10px] font-bold">Izin Pribadi</span>`;
            
            atasanDot = log.status === 'Disetujui' ? 'text-emerald-500' : (log.status === 'Ditolak' ? 'text-rose-500' : 'text-amber-500');
            
            if (log.status === 'Menunggu') {
                btnEdit = `<button onclick="editIP('${log.id}')" class="px-2 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 border border-indigo-500/20 hover:border-indigo-500 text-indigo-400 hover:text-white rounded-lg transition" title="Ubah Pengajuan"><i class="fa-solid fa-pen-to-square"></i></button>`;
                btnBatal = `<button onclick="deleteIP('${log.id}')" class="px-2 py-1.5 bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 hover:border-rose-500 text-rose-400 hover:text-white rounded-lg transition" title="Tarik Pengajuan"><i class="fa-regular fa-trash-can"></i></button>`;
            }
            btnCetak = `<button onclick="cetakIzinPribadi('${log.id}')" class="px-3 py-1.5 bg-emerald-900/50 hover:bg-emerald-700 text-emerald-300 border border-emerald-700 rounded-lg transition shadow-md shadow-emerald-900/20" title="Cetak IP"><i class="fa-solid fa-print text-xs"></i> Cetak IP</button>`;
        }
        else if (log.z_type === 'WFH') {
            jenisText = "Work From Home (WFH)";
            tgl_1 = log.tanggal; tgl_2 = `Pekerjaan Remote`;
            durasiHtml = `<span class="inline-flex px-2 py-0.5 rounded border border-amber-500/20 bg-amber-500/10 text-amber-400 text-[10px] font-bold">WFH</span>`;
            
            if (log.status_rencana === 'Menunggu' || log.status_rencana === 'Ditolak') {
                statusAkhir = log.status_rencana;
                atasanDot = log.status_rencana === 'Ditolak' ? 'text-rose-500' : 'text-amber-500';
                btnCetak = `<button onclick="cetakRencanaWFH('${log.id}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition shadow-md shadow-slate-900/30" title="Cetak Plan"><i class="fa-solid fa-print text-xs"></i> Plan</button>`;
                
                if (log.status_rencana === 'Menunggu') {
                    btnEdit = `<button onclick="editWFHPlan('${log.id}')" class="px-2 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 border border-indigo-500/20 hover:border-indigo-500 text-indigo-400 hover:text-white rounded-lg transition" title="Ubah Rencana"><i class="fa-solid fa-pen-to-square"></i></button>`;
                    btnBatal = `<button onclick="deleteWFH('${log.id}')" class="px-2 py-1.5 bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 hover:border-rose-500 text-rose-400 hover:text-white rounded-lg transition" title="Tarik Plan"><i class="fa-regular fa-trash-can"></i></button>`;
                }
            } else {
                atasanDot = 'text-emerald-500'; // Rencana disetujui
                
                if (log.status_laporan === 'Belum Lapor') {
                    statusAkhir = 'Isi Laporan';
                    btnCetak = `<button onclick="cetakRencanaWFH('${log.id}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition shadow-md shadow-slate-900/30" title="Cetak Plan"><i class="fa-solid fa-print text-xs"></i> Plan</button>`;
                    btnEdit = `<button onclick="openModalLaporanWFH('${log.id}')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white border border-amber-500 rounded-lg transition shadow-lg shadow-amber-500/30 animate-pulse"><i class="fa-solid fa-pen-to-square text-xs"></i> Lapor</button>`;
                } else if (log.status_laporan === 'Menunggu') {
                    statusAkhir = 'Laporan Diperiksa';
                    btnCetak = `<button onclick="cetakRencanaWFH('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition shadow-md shadow-slate-900/30" title="Cetak Plan"><i class="fa-solid fa-print text-xs"></i> Plan</button>
                                <button onclick="cetakLaporanWFH('${log.id}')" class="px-2 py-1.5 bg-emerald-700/50 hover:bg-emerald-600 text-emerald-300 border border-emerald-600 rounded-lg transition shadow-md shadow-emerald-900/20" title="Cetak Lap."><i class="fa-solid fa-print text-xs"></i> Lap.</button>`;
                    btnEdit = `<button onclick="editWFHLap('${log.id}')" class="px-2 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 border border-indigo-500/20 hover:border-indigo-500 text-indigo-400 hover:text-white rounded-lg transition" title="Ubah Laporan"><i class="fa-solid fa-pen-to-square"></i></button>`;
                } else if (log.status_laporan === 'Ditolak') {
                    statusAkhir = 'Laporan Ditolak';
                    btnCetak = `<button onclick="cetakRencanaWFH('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition shadow-md shadow-slate-900/30" title="Cetak Plan"><i class="fa-solid fa-print text-xs"></i> Plan</button>`;
                    btnEdit = `<button onclick="editWFHLap('${log.id}')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white border border-amber-500 rounded-lg transition shadow-lg shadow-amber-500/30"><i class="fa-solid fa-pen-to-square text-xs"></i> Revisi</button>`;
                } else {
                    statusAkhir = 'Disetujui'; // Laporan WFH 100% Selesai
                    btnCetak = `<button onclick="cetakRencanaWFH('${log.id}')" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition shadow-md shadow-slate-900/30" title="Cetak Plan"><i class="fa-solid fa-print text-xs"></i> Plan</button>
                                <button onclick="cetakLaporanWFH('${log.id}')" class="px-2 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-600 rounded-lg transition shadow-lg shadow-emerald-600/30" title="Cetak Lap."><i class="fa-solid fa-print text-xs"></i> Lap.</button>`;
                }
            }
        }

        // PEWARNAAN BADGE STATUS AKHIR
        if (statusAkhir === 'Disetujui') statusColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
        else if (statusAkhir === 'Ditolak' || statusAkhir === 'Laporan Ditolak') statusColor = "text-rose-400 bg-rose-500/10 border-rose-500/20";
        else if (statusAkhir === 'Menunggu Pembatalan') statusColor = "text-purple-400 bg-purple-500/10 border-purple-500/20";
        else if (statusAkhir === 'DIBATALKAN') statusColor = "text-slate-400 bg-slate-800 border-slate-700";
        else if (statusAkhir === 'Isi Laporan') statusColor = "text-amber-400 bg-amber-500/10 border-amber-500/50 border-dashed animate-pulse";
        else if (statusAkhir === 'Laporan Diperiksa') statusColor = "text-sky-400 bg-sky-500/10 border-sky-500/20";

        let tglDecor = statusAkhir === 'DIBATALKAN' ? 'line-through text-slate-500' : 'text-slate-300';

        // TAMPILAN IKON PEJABAT
        let pejabatHtml = '';
        if (log.z_type === 'Cuti') {
            pejabatHtml = `<div class="flex items-center gap-1.5"><i class="fa-solid fa-circle text-[8px] ${pejabatDot}"></i><span class="text-slate-400 truncate max-w-[120px]" title="${pejabat.nama}">Pejabat: ${pejabat.nama}</span></div>`;
        } else {
            pejabatHtml = `<div class="flex items-center gap-1.5 opacity-50"><i class="fa-solid fa-minus text-[8px] text-slate-600"></i><span class="text-slate-500">Tanpa Pejabat</span></div>`;
        }

        const trHtml = [
          '<td class="p-4 text-center font-mono text-slate-500">', (index + 1), '</td>',
          '<td class="p-4">',
          '  <div class="font-bold text-slate-200">', jenisText, '</div>',
          '  <div class="text-[10px] text-slate-500 mt-0.5 font-mono">', log.id, '</div>',
          '</td>',
          '<td class="p-4 ', tglDecor, '">',
          '  <div>', tgl_1, '</div>',
          '  <div class="text-[10px] opacity-70 mt-0.5">', tgl_2, '</div>',
          '</td>',
          '<td class="p-4">',
          '  ', durasiHtml,
          '</td>',
          '<td class="p-4 space-y-1">',
          '  <div class="flex items-center gap-1.5"><i class="fa-solid fa-circle text-[8px] ', atasanDot, '"></i><span class="text-slate-400 truncate max-w-[120px]" title="', atasan.nama, '">Atasan: ', atasan.nama, '</span></div>',
          '  ', pejabatHtml,
          '</td>',
          '<td class="p-4">',
          '  <span class="inline-flex px-2 py-0.5 rounded text-[10px] font-bold border ', statusColor, ' uppercase tracking-wider text-center leading-tight whitespace-nowrap">', statusAkhir.replace(' ', '<br>'), '</span>',
          '</td>',
          '<td class="p-4 text-center">',
          '  <div class="flex items-center justify-center gap-1.5">',
          '    ', btnCetak,
          '    ', btnEdit,
          '    ', btnBatal,
          '  </div>',
          '</td>'
        ].join('');

        const tr = document.createElement('tr');
        tr.className = "border-b border-slate-900 hover:bg-slate-900/10 transition text-xs";
        tr.innerHTML = trHtml;
        tbody.appendChild(tr);
      });
    } catch (e) {
      console.error("Error di renderPermohonanView:", e);
    }
  }

  function calculateDuration(start, end) {
      const d1 = new Date(start); const d2 = new Date(end);
      let count = 0;
      for (let d = new Date(d1); d <= d2; d.setDate(d.getDate() + 1)) {
          if (d.getDay() !== 0 && d.getDay() !== 6) count++;
      }
      return count;
  }

  function toggleBuktiDukung() {
      try {
          const jenis = document.getElementById('cutiJenis').value;
          const container = document.getElementById('containerBuktiDukung');
          const inputBukti = document.getElementById('cutiBukti');
          
          if (jenis !== 'Tahunan') {
              container.classList.remove('hidden');
              inputBukti.required = true;
          } else {
              container.classList.add('hidden');
              inputBukti.required = false;
              inputBukti.value = '';
          }
      } catch (e) {}
  }

  function isPegawaiAbsent(nip) {
      const today = new Date();
      today.setHours(0,0,0,0);
      return state.cutiLogs.some(log => {
          if (String(log.nip) === String(nip) && log.status === 'Disetujui') {
              const start = new Date(log.tgl_mulai);
              start.setHours(0,0,0,0);
              const end = new Date(log.tgl_selesai);
              end.setHours(0,0,0,0);
              return today >= start && today <= end;
          }
          return false;
      });
  }

  function setupAtasanAndPejabat(targetUserObj) {
      const u = targetUserObj || state.user; 
      const j = u.jabatan.toLowerCase();
      let atasanOpts = [];
      let pejabatOpts = [];
      let adaPlh = false;

      function getPegawai(keyword) {
          return state.usersList.filter(x => x.nip !== u.nip && x.jabatan.toLowerCase().includes(keyword));
      }

      let ketua = getPegawai("ketua").find(x => x.jabatan.toLowerCase() === "ketua");
      if (ketua && !isPegawaiAbsent(ketua.nip)) {
          pejabatOpts.push(ketua);
      } else {
          adaPlh = true;
          let wakil = getPegawai("wakil ketua").find(x => x.jabatan.toLowerCase() === "wakil ketua");
          if (wakil && !isPegawaiAbsent(wakil.nip)) pejabatOpts.push(wakil); 
          else { let hakims = getPegawai("hakim").filter(x => !isPegawaiAbsent(x.nip)); pejabatOpts.push(...hakims); }
      }

      if (j === "ketua") { atasanOpts = state.usersList.filter(x => x.nip !== u.nip); }
      else if (j.includes("wakil ketua") || j.includes("hakim") || (j.includes("panitera") && !j.includes("muda") && !j.includes("pengganti")) || j === "sekretaris") {
          atasanOpts = [...pejabatOpts]; 
      }
      else if (j.includes("panitera muda") || j.includes("panitera pengganti") || j.includes("jurusita") || j.includes("juru sita")) {
          let panitera = getPegawai("panitera").find(x => x.jabatan.toLowerCase() === "panitera");
          if (panitera && !isPegawaiAbsent(panitera.nip)) { atasanOpts.push(panitera); } 
          else {
              adaPlh = true; let panmuds = getPegawai("panitera muda").filter(x => !isPegawaiAbsent(x.nip));
              atasanOpts.push(...panmuds);
          }
      }
      else if (j.includes("kepala sub bagian") || j.includes("kasubbag")) {
          let sekretaris = getPegawai("sekretaris").find(x => x.jabatan.toLowerCase() === "sekretaris");
          if (sekretaris && !isPegawaiAbsent(sekretaris.nip)) { atasanOpts.push(sekretaris); } 
          else {
              adaPlh = true; let kasubbags = getPegawai("kepala sub bagian").filter(x => !isPegawaiAbsent(x.nip));
              if(kasubbags.length === 0) kasubbags = getPegawai("kasubbag").filter(x => !isPegawaiAbsent(x.nip));
              atasanOpts.push(...kasubbags);
          }
      }
      else {
          let panmuds = getPegawai("panitera muda").filter(x => !isPegawaiAbsent(x.nip));
          let kasubbags = getPegawai("kepala sub bagian").filter(x => !isPegawaiAbsent(x.nip));
          if(kasubbags.length === 0) kasubbags = getPegawai("kasubbag").filter(x => !isPegawaiAbsent(x.nip));
          atasanOpts.push(...panmuds); atasanOpts.push(...kasubbags);
          let panitera = getPegawai("panitera").find(x => x.jabatan.toLowerCase() === "panitera");
          if (panitera && !isPegawaiAbsent(panitera.nip)) atasanOpts.push(panitera);
          let sekretaris = getPegawai("sekretaris").find(x => x.jabatan.toLowerCase() === "sekretaris");
          if (sekretaris && !isPegawaiAbsent(sekretaris.nip)) atasanOpts.push(sekretaris);
      }

      atasanOpts = [...new Map(atasanOpts.map(item => [item.nip, item])).values()];
      pejabatOpts = [...new Map(pejabatOpts.map(item => [item.nip, item])).values()];

      const selAtasan = document.getElementById('cutiAtasan');
      const selPejabat = document.getElementById('cutiPejabat');
      const alertPlh = document.getElementById('alertPlh');
      
      const selPlhCuti = document.getElementById('cutiPlh');
      const containerPlhCuti = document.getElementById('containerPlhCuti');
      if (selPlhCuti) selPlhCuti.innerHTML = '<option value="">-- Pilih Pejabat Plh --</option>';
      
      let opsiPlhCuti = [];
      let isPanitera = j === "panitera";
      let isSekretaris = j === "sekretaris";

      if (isPanitera) {
           opsiPlhCuti = getPegawai("panitera muda").filter(x => !isPegawaiAbsent(x.nip));
           if(containerPlhCuti) containerPlhCuti.classList.remove('hidden');
      } else if (isSekretaris) {
           opsiPlhCuti = getPegawai("kepala sub bagian").filter(x => !isPegawaiAbsent(x.nip));
           if(opsiPlhCuti.length === 0) opsiPlhCuti = getPegawai("kasubbag").filter(x => !isPegawaiAbsent(x.nip));
           if(containerPlhCuti) containerPlhCuti.classList.remove('hidden');
      } else {
           if(containerPlhCuti) containerPlhCuti.classList.add('hidden');
      }

      if (selPlhCuti) {
           opsiPlhCuti.forEach(o => { selPlhCuti.innerHTML += `<option value="${o.nip}">${o.nama} (${o.jabatan})</option>`; });
      }
      
      selAtasan.innerHTML = '<option value="">-- Pilih Atasan --</option>';
      atasanOpts.forEach(o => { selAtasan.innerHTML += `<option value="${o.nip}">${o.nama} (${o.jabatan})</option>`; });

      selPejabat.innerHTML = '<option value="">-- Pilih Pejabat Berwenang --</option>';
      pejabatOpts.forEach(o => { selPejabat.innerHTML += `<option value="${o.nip}">${o.nama} (${o.jabatan})</option>`; });
      
      if(atasanOpts.length === 1) selAtasan.value = atasanOpts[0].nip;
      if(pejabatOpts.length === 1) selPejabat.value = pejabatOpts[0].nip;
      if (adaPlh) alertPlh.classList.remove('hidden'); else alertPlh.classList.add('hidden');
  }

  function openFormCutiModal(isBypass = false) {
    try {
      if (!state || !state.user) {
          if(typeof showNotify === 'function') showNotify("Sistem Memuat", "Silakan tunggu, data belum siap.", "error");
          return;
      }
      
      isBypassMode = isBypass;

      const containerBypass = document.getElementById('containerBypassPegawai');
      const selectBypass = document.getElementById('cutiBypassNip');
      const titleModal = document.getElementById('modalFormCutiTitle');
      
      if (isBypass) {
          titleModal.innerHTML = '<i class="fa-solid fa-user-shield text-indigo-400 mr-2"></i> Mode Bypass: Usulan Cuti';

             selectBypass.innerHTML += `<option value="${u.nip}">${u.nama} (${u.jabatan})</option>`;

  function readFileAsBase64(file) {
      return new Promise(function(resolve, reject) {
          const reader = new FileReader();
          reader.onload = function() { resolve(reader.result); };
          reader.onerror = function(error) { reject(error); };
          reader.readAsDataURL(file);
      });
  }

  async function submitCuti(e) {
    e.preventDefault();
    if(!state.user) { showNotify("Error Sesi", "Harap login ulang", "error"); return; }
    
    const fileInput = document.getElementById('cutiBukti');
    let fileData = null, fileName = null, fileMimeType = null;
    
    if (document.getElementById('cutiJenis').value !== 'Tahunan') {
        if (fileInput.files.length === 0) { showNotify("Validasi", "Bukti dukung wajib dilampirkan!", "error"); return; }
        const file = fileInput.files[0];
        if (file.size > 2 * 1024 * 1024) { showNotify("File Besar", "Maksimal 2MB.", "error"); return; }
        
        showLoading("Membaca dokumen lampiran...");
        try {
           const base64Str = await readFileAsBase64(file);
           fileData = base64Str.split(',')[1];
           fileName = file.name;
           fileMimeType = file.type;
        } catch(err) {
           hideLoading(); showNotify("Error", "Gagal memproses file.", "error"); return;
        }
    }

    let finalNip = state.user.nip;
    if (isBypassMode) {
        finalNip = document.getElementById('cutiBypassNip').value;
        if (!finalNip) { hideLoading(); showNotify("Validasi", "Pilih pegawai pemohon terlebih dahulu!", "error"); return; }
    }

    const payload = {
        nip: finalNip,
        jenis: document.getElementById('cutiJenis').value,
        tgl_mulai: document.getElementById('cutiMulai').value,
        tgl_selesai: document.getElementById('cutiSelesai').value,
        alasan: document.getElementById('cutiAlasan').value,
        alamat: document.getElementById('cutiAlamat').value,
        atasan_nip: document.getElementById('cutiAtasan').value,
        pejabat_nip: document.getElementById('cutiPejabat').value,
        plh_nip: document.getElementById('containerPlhCuti') && !document.getElementById('containerPlhCuti').classList.contains('hidden') ? document.getElementById('cutiPlh').value : "",
        fileData: fileData, fileName: fileName, fileMimeType: fileMimeType
    };

    if (new Date(payload.tgl_selesai) < new Date(payload.tgl_mulai)) {
       hideLoading();
       showNotify("Tanggal Invalid", "Selesai pelaksanaan tidak boleh sebelum tanggal mulai.", "error");
       return;
    }

    // Deteksi Tanggal Ganda (Overlapping Dates Conflict)
    const newStart = new Date(payload.tgl_mulai);
    newStart.setHours(0,0,0,0);
    const newEnd = new Date(payload.tgl_selesai);
    newEnd.setHours(0,0,0,0);

    const isOverlap = state.cutiLogs.some(log => {
        if (String(log.nip) === String(payload.nip) && log.status !== 'Ditolak' && log.status !== 'DIBATALKAN') {
            const existingStart = new Date(log.tgl_mulai);
            existingStart.setHours(0,0,0,0);
            const existingEnd = new Date(log.tgl_selesai);
            existingEnd.setHours(0,0,0,0);
            return (newStart <= existingEnd && newEnd >= existingStart);
        }
        return false;
    });

    if (isOverlap) {
        hideLoading();
        showNotify("Tanggal Bentrok", "Pengajuan gagal! Anda (atau pegawai ini) sudah memiliki izin/cuti yang aktif pada rentang tanggal tersebut.", "warning");
        return;
    }

    showLoading("Memverifikasi ketersediaan Pejabat...");
    
    google.script.run
        .withSuccessHandler(function(routeRes) {
            if (routeRes && routeRes.status === 'success') {
                payload.atasan_nip = routeRes.data.atasan_nip;
                payload.pejabat_nip = routeRes.data.pejabat_nip;
                let routingMsg = routeRes.data.pesan;
                
                showLoading("Mengirimkan usulan cuti...");
                google.script.run
                  .withSuccessHandler(function(res) {
                    hideLoading();
                    closeFormCutiModal();
                    if (res.status === 'success') {
                      if(routingMsg) {
                          showNotify("Berhasil Terkirim", res.message + "<br><br><span class='text-[10px] text-amber-400'>Info Pengalihan:</span><br><span class='text-[10px] leading-relaxed'>" + routingMsg + "</span>", "success");
                      } else {
                          showNotify("Berhasil Terkirim", res.message, "success");
                      }
                      
                      if (res.data) {
                          const logVirtual = {
                              id: res.data.id, tgl_pengajuan: res.data.tgl_pengajuan, nip: payload.nip,
                              jenis: payload.jenis, tgl_mulai: payload.tgl_mulai, tgl_selesai: payload.tgl_selesai,
                              alasan: payload.alasan, status: res.data.status, status_atasan: res.data.status,
                              atasan_nip: payload.atasan_nip, pejabat_nip: payload.pejabat_nip, sisa_cuti: res.data.durasi,
                              status_pejabat: res.data.status, alamat: payload.alamat, history: res.data.history, bukti_url: res.data.fileUrl,
                              plh_nip: payload.plh_nip
                          };
                          if (state && state.cutiLogs) state.cutiLogs.unshift(logVirtual);

                          if (state.usersList) {
                              const targetUserIdx = state.usersList.findIndex(u => String(u.nip) === String(payload.nip));
                              if (targetUserIdx !== -1) {
                                  let targetUser = state.usersList[targetUserIdx];
                                  if (payload.jenis === 'Tahunan') {
                                      try {
                                          let h = JSON.parse(res.data.history);
                                          targetUser.s_tahunan_2024 = Number(targetUser.s_tahunan_2024 || 0) - (h.y24 || 0);
                                          targetUser.s_tahunan_2025 = Number(targetUser.s_tahunan_2025 || 0) - (h.y25 || 0);
                                          targetUser.s_tahunan_2026 = Number(targetUser.s_tahunan_2026 || 0) - (h.y26 || 0);
                                      } catch(e) {}
                                  } else {
                                      let field = "";
                                      if(payload.jenis === 'Sakit') field = 's_sakit';
                                      else if(payload.jenis === 'Alasan Penting' || payload.jenis === 'Penting') field = 's_penting';
                                      else if(payload.jenis === 'Besar') field = 's_besar';
                                      else if(payload.jenis === 'Melahirkan') field = 's_melahirkan';
                                      else if(payload.jenis === 'CLTN') field = 's_cltn';
                                      if (field !== "") targetUser[field] = Number(targetUser[field] || 0) - res.data.durasi;
                                  }
                                  
                                  if (String(payload.nip) === String(state.user.nip)) {
                                      state.user = Object.assign({}, targetUser);
                                  }
                              }
                          }
                          if (typeof renderPermohonanView === 'function') renderPermohonanView();
                      }
                    } else {
                      showNotify("Pengajuan Gagal", res.message, "error");
                    }
                  })
                  .withFailureHandler(function(err) {
                    hideLoading();
                    showNotify("Error Koneksi", err.toString(), "error");
                  })
                  .addCutiLog(payload);
                  
            } else {
                hideLoading();
                showNotify("Error Routing", routeRes.message, "error");
            }
        })
        .withFailureHandler(function(err) {
            hideLoading();
            showNotify("Error Koneksi", "Gagal memindai ketersediaan pejabat: " + err.toString(), "error");
        })
        .getSmartRouting(payload.atasan_nip, payload.pejabat_nip, payload.tgl_mulai, payload.tgl_selesai);
  }

  function deleteCutiRecord(id) {
    showCustomConfirm("Tarik Pengajuan", "Batalkan dan tarik pengajuan ini? Saldo cuti Anda akan dikembalikan utuh.", function() {
      showLoading("Menarik data...");
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.status === 'success') {
            showNotify("Ditarik", res.message, "success");
            
            if (state && state.cutiLogs && state.user) {
                const logIndex = state.cutiLogs.findIndex(function(l) { return String(l.id) === String(id); });
                if (logIndex !== -1) {
                    const logToCancel = state.cutiLogs[logIndex];
                    if (logToCancel.jenis === 'Tahunan') {
                        try {
                            let h = JSON.parse(logToCancel.history || "{}");
                            state.user.s_tahunan_2024 = Number(state.user.s_tahunan_2024 || 0) + (Number(h.y24) || 0);
                            state.user.s_tahunan_2025 = Number(state.user.s_tahunan_2025 || 0) + (Number(h.y25) || 0);
                            state.user.s_tahunan_2026 = Number(state.user.s_tahunan_2026 || 0) + (Number(h.y26) || 0);
                        } catch(e) {}
                    } else {
                        let field = "";
                        if(logToCancel.jenis === 'Sakit') field = 's_sakit';
                        else if(logToCancel.jenis === 'Alasan Penting' || logToCancel.jenis === 'Penting') field = 's_penting';
                        else if(logToCancel.jenis === 'Besar') field = 's_besar';
                        else if(logToCancel.jenis === 'Melahirkan') field = 's_melahirkan';
                        else if(logToCancel.jenis === 'CLTN') field = 's_cltn';
                        if (field !== "") state.user[field] = Number(state.user[field] || 0) + Number(logToCancel.sisa_cuti || 0);
                    }
                    
                    if (state.usersList) {
                        const uIdx = state.usersList.findIndex(function(u) { return String(u.nip) === String(state.user.nip); });
                        if (uIdx !== -1) state.usersList[uIdx] = Object.assign({}, state.user);
                    }
                    state.cutiLogs.splice(logIndex, 1);
                    if (typeof renderPermohonanView === 'function') renderPermohonanView();
                }
            }
          } else { showNotify("Gagal Membatalkan", res.message, "error"); }
        })
        .withFailureHandler(function(err) { hideLoading(); showNotify("Error", err.toString(), "error"); })
        .deleteCutiLog(id);
    });
  }
