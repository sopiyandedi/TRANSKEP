<script>
  // =========================================================================
  // LOGIKA CLIENT-SIDE: AKSI TOMBOL (HAPUS, TARIK, BATAL)
  // =========================================================================

  function deleteCutiRecord(id) {
    const token = localStorage.getItem('transkep_session_token'); 
    showCustomConfirm("Tarik Pengajuan", "Batalkan dan tarik pengajuan ini? Saldo cuti Anda akan dikembalikan utuh.", function() {
      showLoading("Menarik data...");
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.status === 'success') {
            showNotify("Ditarik", res.message, "success");
            
            if (state && state.cutiLogs && state.user) {
                const logIndex = state.cutiLogs.findIndex(function(l) { return String(l.id) === String(id); });
                if (logIndex !== -1) {
                    const logToCancel = state.cutiLogs[logIndex];
                    if (logToCancel.jenis === 'Tahunan') {
                        try {
                            let h = JSON.parse(logToCancel.history || "{}");
                            state.user.s_tahunan_2024 = Number(state.user.s_tahunan_2024 || 0) + (Number(h.y24) || 0);
                            state.user.s_tahunan_2025 = Number(state.user.s_tahunan_2025 || 0) + (Number(h.y25) || 0);
                            state.user.s_tahunan_2026 = Number(state.user.s_tahunan_2026 || 0) + (Number(h.y26) || 0);
                        } catch(e) {}
                    } else {
                        let field = "";
                        if(logToCancel.jenis === 'Sakit') field = 's_sakit';
                        else if(logToCancel.jenis === 'Alasan Penting' || logToCancel.jenis === 'Penting') field = 's_penting';
                        else if(logToCancel.jenis === 'Besar') field = 's_besar';
                        else if(logToCancel.jenis === 'Melahirkan') field = 's_melahirkan';
                        else if(logToCancel.jenis === 'CLTN') field = 's_cltn';
                        if (field !== "") state.user[field] = Number(state.user[field] || 0) + Number(logToCancel.sisa_cuti || 0);
                    }
                    
                    if (state.usersList) {
                        const uIdx = state.usersList.findIndex(function(u) { return String(u.nip) === String(state.user.nip); });
                        if (uIdx !== -1) state.usersList[uIdx] = Object.assign({}, state.user);
                    }
                    
                    // Cukup hapus dari State Array. Vue Proxy akan mengurus tampilan UI secara instan.
                    state.cutiLogs.splice(logIndex, 1);
                }
            }
          } else { showNotify("Gagal Membatalkan", res.message, "error"); }
        })
        .withFailureHandler(function(err) { hideLoading(); showNotify("Error", err.toString(), "error"); })
        .deleteCutiLog(id, false, state.user.nip, token); 
    });
  }

  }

  function editCuti(id) {
      const log = state.cutiLogs.find(l => String(l.id) === String(id));
      if (!log) {
          showNotify("Error", "Data pengajuan cuti tidak ditemukan.", "error");
          return;
      }
      if (window.vmFormCuti) {
          window.vmFormCuti.openModal(false, log);
      } else {
          showNotify("Error Modul", "Sistem Vue Form belum termuat. Coba muat ulang halaman.", "error");
      }
  }
  
  function editIK(id) { openModalIK(id); }
  function editIP(id) { openModalIP(id); }
  function editWFHPlan(id) { openModalWFH(id); }
  function editWFHLap(id) { openModalLaporanWFH(id); }
