  function switchCutiTab(tabId) {
      document.querySelectorAll('.cuti-tab-content').forEach(function(el) {
          el.classList.add('hidden');
          el.classList.remove('block'); 
          el.style.opacity = '0';
          el.style.transition = 'none';
      });
      
      const targetContent = document.getElementById('tab-' + tabId);
      if (targetContent) {
          targetContent.classList.remove('hidden');
          targetContent.classList.add('block');
          
          setTimeout(() => {
              targetContent.style.transition = 'opacity 0.4s ease-in-out';
              targetContent.style.opacity = '1';
          }, 20);
      }

      const tabs = ['riwayat', 'verifikasi', 'rekapitulasi'];
      tabs.forEach(function(id) {
          const btn = document.getElementById('btn-tab-' + id);
          if (!btn) return;
          
          if (id === tabId) {
              btn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
              btn.classList.remove('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800');
          } else {
              btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
              btn.classList.add('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800');
          }
      });
      
      if (tabId === 'verifikasi' && typeof renderPersetujuanView === 'function') renderPersetujuanView();
      if (tabId === 'rekapitulasi' && typeof renderRekapitulasiView === 'function') renderRekapitulasiView();
  }

  function updateBadgePermohonan() {
      if (!state || !state.user) return;
      const myRole = state.user.role;
      const myNip = String(state.user.nip);
      const isAdmin = (myRole === 'Admin' || myRole === 'Operator');

      let pendingCount = 0;
      let countAtasan = 0;
      let countPejabat = 0;

      if (state.cutiLogs) {
          state.cutiLogs.forEach(function(log) {
              const isPendingBatal = (log.status === 'Menunggu Pembatalan');
              if (log.status !== 'Menunggu' && !isPendingBatal) return;
              
              if (isAdmin) {
                  pendingCount++;
                  if (log.status_atasan === 'Menunggu') countAtasan++;
                  if (log.status_pejabat === 'Menunggu' && log.status_atasan === 'Disetujui') countPejabat++;
                  if (isPendingBatal) countPejabat++; 
              } else {
                  if (isPendingBatal && String(log.pejabat_nip) === myNip) pendingCount++;
                  else if (!isPendingBatal && String(log.atasan_nip) === myNip && log.status_atasan === 'Menunggu') pendingCount++;
                  else if (!isPendingBatal && String(log.pejabat_nip) === myNip && log.status_pejabat === 'Menunggu' && log.status_atasan === 'Disetujui') pendingCount++;
              }
          });
      }

      if (state.ikLogs) {
          state.ikLogs.forEach(function(log) {
              if (log.status !== 'Menunggu') return;
              if (isAdmin) { pendingCount++; countAtasan++; }
              else if (String(log.atasan_nip) === myNip) pendingCount++;
          });
      }

      if (state.ipLogs) {
          state.ipLogs.forEach(function(log) {
              if (log.status !== 'Menunggu') return;
              if (isAdmin) { pendingCount++; countAtasan++; }
              else if (String(log.atasan_nip) === myNip) pendingCount++;
          });
      }

      if (state.wfhLogs) {
          state.wfhLogs.forEach(function(log) {
              if (log.status_rencana === 'Menunggu' || log.status_laporan === 'Menunggu') {
                  if (isAdmin) { pendingCount++; countAtasan++; }
                  else if (String(log.atasan_nip) === myNip) pendingCount++;
              }
          });
      }

      const badgeVerifikasi = document.getElementById('badge-verifikasi');
      if (badgeVerifikasi) {
          if (pendingCount > 0) {
              badgeVerifikasi.innerText = pendingCount;
              badgeVerifikasi.classList.remove('hidden');
          } else {
              badgeVerifikasi.classList.add('hidden');
          }
      }

      if (isAdmin) {
          const btnAtasan = document.getElementById('btnBypassAtasan');
          const btnPejabat = document.getElementById('btnBypassPejabat');
          if (btnAtasan) btnAtasan.innerText = `Atasan Langsung (${countAtasan})`;
          if (btnPejabat) btnPejabat.innerText = `Pejabat Berwenang (${countPejabat})`;
      }

      const navPermohonan = document.getElementById('nav-permohonan');
      if (navPermohonan) {
          let badgeSidebar = document.getElementById('badge-permohonan-nav');
          if (!badgeSidebar) {
              navPermohonan.classList.add('relative');
              badgeSidebar = document.createElement('span');
              badgeSidebar.id = 'badge-permohonan-nav';
              badgeSidebar.className = 'absolute top-2 left-[28px] z-10 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-[9px] text-white font-bold shadow-[0_0_10px_rgba(244,63,94,0.8)] border-[1.5px] border-slate-900 animate-pulse hidden pointer-events-none';
              navPermohonan.appendChild(badgeSidebar);
          }
          if (pendingCount > 0) {
              badgeSidebar.innerText = pendingCount > 99 ? '99+' : pendingCount;
              badgeSidebar.classList.remove('hidden');
          } else {
              badgeSidebar.classList.add('hidden');
          }
      }
  }

  window.getActiveCutiYears = window.getActiveCutiYears || function(userObj) {
      const liveYear = new Date().getFullYear();
      if (userObj && Array.isArray(userObj.cuti_years) && userObj.cuti_years.length === 3 && Number(userObj.cuti_years[2]) >= liveYear) {
          return userObj.cuti_years.map(Number);
      }
      return [liveYear - 2, liveYear - 1, liveYear];
  };

  window.parseLocalYmdCuti = window.parseLocalYmdCuti || function(str) {
      if (!str) return null;
      const s = String(str).trim();
      const parts = s.includes('/') ? s.split('/') : s.split('-');
      if (parts.length === 3) {
          if (parts[0].length === 4) {
              return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10), 12, 0, 0);
          } else {
              const yr = parts[2].length === 2 ? parseInt('20' + parts[2], 10) : parseInt(parts[2], 10);
              return new Date(yr, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), 12, 0, 0);
          }
      }
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
  };

  window.hitungHariKerjaCuti = window.hitungHariKerjaCuti || function(startStr, endStr) {
      const d1 = window.parseLocalYmdCuti(startStr);
      const d2 = window.parseLocalYmdCuti(endStr);
      if (!d1 || !d2 || d2 < d1) {
          return { durasi: 0, holidayCount: 0, weekendCount: 0, skippedHolidays: [], invalidOrder: Boolean(d1 && d2 && d2 < d1) };
      }
      let durasi = 0, holidayCount = 0, weekendCount = 0;
      const skippedHolidays = [];
      for (let d = new Date(d1.getTime()); d <= d2; d.setDate(d.getDate() + 1)) {
          const dow = d.getDay();
          if (dow === 0 || dow === 6) { weekendCount++; continue; }
          const ymd = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          if (window.TRANSKEP_HOLIDAYS_MAP[ymd]) {
              holidayCount++;
              skippedHolidays.push({ date: ymd, name: window.TRANSKEP_HOLIDAYS_MAP[ymd] });
          } else {
              durasi++;
          }
      }
      return { durasi, holidayCount, weekendCount, skippedHolidays, invalidOrder: false };
  };

  window.simulasiPotongCutiClient = window.simulasiPotongCutiClient || function(userObj, jenis, durasi, editLog) {
      const years = window.getActiveCutiYears(userObj);
      if (!userObj) return { valid: true, durasi, years };

      let sN2 = Math.max(0, Number(userObj.s_tahunan_2024 || 0));
      let sN1 = Math.max(0, Number(userObj.s_tahunan_2025 || 0));
      let sN  = Math.max(0, Number(userObj.s_tahunan_2026 || 0));
      let sSakit = Math.max(0, Number(userObj.s_sakit || 0));
      let sPenting = Math.max(0, Number(userObj.s_penting || 0));
      let sBesar = Math.max(0, Number(userObj.s_besar || 0));
      let sMelahirkan = Math.max(0, Number(userObj.s_melahirkan || 0));

      if (editLog && String(editLog.status || '').toLowerCase() === 'menunggu') {
          let h = {};
          try { h = (typeof editLog.history === 'string') ? JSON.parse(editLog.history || '{}') : (editLog.history || {}); } catch(e) {}
          if (editLog.jenis === 'Tahunan') {
              sN2 += (Number(h.y24) || 0) + (Number(h.hangus_n2) || 0);
              sN1 += (Number(h.y25) || 0);
              sN  += (Number(h.y26) || 0);
          } else {
              const oldDur = Number(h.dur || editLog.sisa_cuti || 0);
              if (editLog.jenis === 'Sakit') sSakit += oldDur;
              else if (editLog.jenis === 'Alasan Penting' || editLog.jenis === 'Penting') sPenting += oldDur;
              else if (editLog.jenis === 'Besar') { sBesar += oldDur; sN += (Number(h.hangus_n_besar) || 0); }
              else if (editLog.jenis === 'Melahirkan') sMelahirkan += oldDur;
          }
      }

      if (jenis === 'Dinas Luar' || jenis === 'CLTN') {
          return { valid: durasi > 0 || jenis === 'Dinas Luar', durasi, years, tersedia: '-', sisaAkhir: '-', hangusN2: 0, hangusNBesar: 0 };
      }
      if (durasi <= 0) {
          return { valid: false, errorMsg: 'Rentang tanggal yang dipilih seluruhnya akhir pekan atau Libur Nasional / Cuti Bersama SKB (0 hari kerja efektif).', durasi: 0, years, tersedia: 0, sisaAkhir: 0, hangusN2: 0, hangusNBesar: 0 };
      }
      if (jenis === 'Tahunan') {
          const totalTersedia = sN2 + sN1 + sN;
          const batasTanpaN2 = sN1 + sN;
          if (totalTersedia < durasi) {
              return { valid: false, errorMsg: 'Maaf, sisa kuota Cuti Tahunan (' + totalTersedia + ' Hari) tidak mencukupi untuk pengajuan ' + durasi + ' Hari.', durasi, years, tersedia: totalTersedia, sisaAkhir: totalTersedia - durasi, sN2_awal: sN2, sN1_awal: sN1, sN_awal: sN, batasTanpaN2, hangusN2: 0, hangusNBesar: 0 };
          }
          let potongN2 = 0, potongN1 = 0, potongN = 0, hangusN2 = 0;
          let sN2_akhir = sN2, sN1_akhir = sN1, sN_akhir = sN;
          let sisa = durasi;
          if (sN2 > 0 && durasi <= batasTanpaN2) {
              hangusN2 = sN2; sN2_akhir = 0;
              if (sN1 >= sisa) { potongN1 = sisa; sN1_akhir = sN1 - sisa; sisa = 0; }
              else { potongN1 = sN1; sisa -= sN1; sN1_akhir = 0; }
              if (sisa > 0) { potongN = sisa; sN_akhir = sN - sisa; sisa = 0; }
          } else {
              if (sN2 >= sisa) { potongN2 = sisa; sN2_akhir = sN2 - sisa; sisa = 0; }
              else { potongN2 = sN2; sisa -= sN2; sN2_akhir = 0; }
              if (sisa > 0) {
                  if (sN1 >= sisa) { potongN1 = sisa; sN1_akhir = sN1 - sisa; sisa = 0; }
                  else { potongN1 = sN1; sisa -= sN1; sN1_akhir = 0; }
              }
              if (sisa > 0) { potongN = sisa; sN_akhir = sN - sisa; sisa = 0; }
          }
          return { valid: true, durasi, years, tersedia: totalTersedia, sisaAkhir: sN2_akhir + sN1_akhir + sN_akhir, sN2_awal: sN2, sN1_awal: sN1, sN_awal: sN, sN2_akhir, sN1_akhir, sN_akhir, potongN2, potongN1, potongN, batasTanpaN2, hangusN2, hangusNBesar: 0 };
      }
      const poolMap = { 'Sakit': sSakit, 'Alasan Penting': sPenting, 'Penting': sPenting, 'Besar': sBesar, 'Melahirkan': sMelahirkan };
      const tersedia = poolMap[jenis] !== undefined ? poolMap[jenis] : 0;
      if (tersedia < durasi) {
          return { valid: false, errorMsg: 'Maaf, sisa kuota Cuti ' + jenis + ' (' + tersedia + ' Hari) tidak mencukupi untuk pengajuan ' + durasi + ' Hari.', durasi, years, tersedia, sisaAkhir: tersedia - durasi, hangusN2: 0, hangusNBesar: 0 };
      }
      const hangusNBesar = (jenis === 'Besar' && sN > 0) ? sN : 0;
      return { valid: true, durasi, years, tersedia, sisaAkhir: tersedia - durasi, sN_akhir: hangusNBesar > 0 ? 0 : sN, hangusN2: 0, hangusNBesar };
  };

  window.terapkanPotongCutiClient = window.terapkanPotongCutiClient || function(userObj, jenis, historyOrSim, durasiFallback) {
      if (!userObj || jenis === 'Dinas Luar' || jenis === 'CLTN') return;
      let h = {};
      if (historyOrSim) { try { h = (typeof historyOrSim === 'string') ? JSON.parse(historyOrSim) : historyOrSim; } catch(e) {} }
      if (jenis === 'Tahunan') {
          const p24 = Number(h.y24 !== undefined ? h.y24 : h.potongN2) || 0;
          const p25 = Number(h.y25 !== undefined ? h.y25 : h.potongN1) || 0;
          const p26 = Number(h.y26 !== undefined ? h.y26 : h.potongN) || 0;
          const hgN2 = Number(h.hangus_n2 !== undefined ? h.hangus_n2 : h.hangusN2) || 0;
          userObj.s_tahunan_2024 = Math.max(0, Number(userObj.s_tahunan_2024 || 0) - p24 - hgN2);
          userObj.s_tahunan_2025 = Math.max(0, Number(userObj.s_tahunan_2025 || 0) - p25);
          userObj.s_tahunan_2026 = Math.max(0, Number(userObj.s_tahunan_2026 || 0) - p26);
      } else {
          const mapCol = { 'Sakit': 's_sakit', 'Alasan Penting': 's_penting', 'Penting': 's_penting', 'Besar': 's_besar', 'Melahirkan': 's_melahirkan' };
          const fld = mapCol[jenis];
          const dur = Number(h.dur || durasiFallback || 0);
          if (fld && userObj[fld] !== undefined) userObj[fld] = Math.max(0, Number(userObj[fld] || 0) - dur);
          const hgBesar = Number(h.hangus_n_besar !== undefined ? h.hangus_n_besar : h.hangusNBesar) || 0;
          if (jenis === 'Besar' && hgBesar > 0) userObj.s_tahunan_2026 = Math.max(0, Number(userObj.s_tahunan_2026 || 0) - hgBesar);
      }
  };

  window.terapkanRefundCutiClient = window.terapkanRefundCutiClient || function(userObj, logRecord) {
      if (!userObj || !logRecord || logRecord.jenis === 'Dinas Luar') return;
      let h = {};
      try { h = (typeof logRecord.history === 'string') ? JSON.parse(logRecord.history || '{}') : (logRecord.history || {}); } catch(e) {}
      if (logRecord.jenis === 'Tahunan') {
          userObj.s_tahunan_2024 = Number(userObj.s_tahunan_2024 || 0) + (Number(h.y24) || 0) + (Number(h.hangus_n2) || 0);
          userObj.s_tahunan_2025 = Number(userObj.s_tahunan_2025 || 0) + (Number(h.y25) || 0);
          userObj.s_tahunan_2026 = Number(userObj.s_tahunan_2026 || 0) + (Number(h.y26) || 0);
      } else {
          let field = '';
          if (logRecord.jenis === 'Sakit') field = 's_sakit';
          else if (logRecord.jenis === 'Alasan Penting' || logRecord.jenis === 'Penting') field = 's_penting';
          else if (logRecord.jenis === 'Besar') field = 's_besar';
          else if (logRecord.jenis === 'Melahirkan') field = 's_melahirkan';
          else if (logRecord.jenis === 'CLTN') field = 's_cltn';
          const dur = Number(h.dur || logRecord.sisa_cuti || 0);
          if (field !== '') userObj[field] = Number(userObj[field] || 0) + dur;
          if (logRecord.jenis === 'Besar' && Number(h.hangus_n_besar) > 0) {
              userObj.s_tahunan_2026 = Number(userObj.s_tahunan_2026 || 0) + Number(h.hangus_n_besar);
          }
      }
  };

  function calculateDuration(start, end) {
      return window.hitungHariKerjaCuti(start, end).durasi;
  }

  function renderPermohonanView() {
      const btnVerifikasi = document.getElementById('btn-tab-verifikasi');
      if (state && state.user && btnVerifikasi) {
          const myRole = state.user.role;
          if (['Admin', 'Operator', 'Atasan Langsung', 'Pejabat Berwenang'].includes(myRole)) {
              btnVerifikasi.classList.remove('hidden');
          } else {
              btnVerifikasi.classList.add('hidden');
              const tabVerifikasi = document.getElementById('tab-verifikasi');
              if (tabVerifikasi && !tabVerifikasi.classList.contains('hidden')) switchCutiTab('riwayat');
          }
      }
      if(typeof updateBadgePermohonan === 'function') updateBadgePermohonan();
  }

  document.addEventListener("DOMContentLoaded", () => {
      const { createApp } = Vue;

      window.vmRiwayatPermohonan = createApp({
          data() {
              return {
                  s: window.vueState || state, // Mengikat variabel global state/vueState ke dalam lokal Vue
                  activeDropdownId: null, // TAHAP 43: ID Dropdown aksi yang sedang terbuka
                  isRefreshing: false
              };
          },
          computed: {
              // Engine Pengolah Data Otomatis
              formattedLogs() {
                  const userObj = (this.s && this.s.user) || (window.vueState && window.vueState.user) || state.user;
                  if (!userObj || !userObj.nip) return [];

                  const myLogs = [];
                  const myNipClean = String(userObj.nip).replace(/[^0-9]/g, '');
                  
                  const cutiList = (this.s && this.s.cutiLogs && this.s.cutiLogs.length > 0) ? this.s.cutiLogs : ((window.vueState && window.vueState.cutiLogs) || state.cutiLogs || []);
                  if (cutiList && cutiList.length > 0) {
                      cutiList.filter(l => {
                          const lNip = String(l.nip || '').replace(/[^0-9]/g, '');
                          return lNip === myNipClean;
                      }).forEach(l => {
                          let idSort = 0;
                          if (l.id) {
                            const parts = String(l.id).split('-');
                            idSort = parseInt(parts[1] || parts[0]) || 0;
                          }
                          myLogs.push(Object.assign({}, l, { z_type: 'Cuti', z_sort: idSort }));
                      });
                  }
                  const ikList = (this.s && this.s.ikLogs && this.s.ikLogs.length > 0) ? this.s.ikLogs : ((window.vueState && window.vueState.ikLogs) || state.ikLogs || []);
                  if (ikList && ikList.length > 0) {
                      ikList.filter(l => String(l.nip || '').replace(/[^0-9]/g, '') === myNipClean).forEach(l => {
                          let idSort = 0;
                          if (l.id) {
                            const parts = String(l.id).split('-');
                            idSort = parseInt(parts[1] || parts[0]) || 0;
                          }
                          myLogs.push(Object.assign({}, l, { z_type: 'IK', z_sort: idSort }));
                      });
                  }
                  const ipList = (this.s && this.s.ipLogs && this.s.ipLogs.length > 0) ? this.s.ipLogs : ((window.vueState && window.vueState.ipLogs) || state.ipLogs || []);
                  if (ipList && ipList.length > 0) {

          methods: {

                  if (this.isRefreshing) return;
                  this.isRefreshing = true;
                  try {
                      if (typeof syncBackgroundData === 'function') {
                          syncBackgroundData();
                      } else if (typeof syncAllServerData === 'function') {
                          syncAllServerData(true);
                      }
                      setTimeout(() => {
                          this.isRefreshing = false;
                      }, 1500);
                  } catch (err) {
                      this.isRefreshing = false;
                  }
              },

              toggleActionDropdown(id) {
                  this.activeDropdownId = (this.activeDropdownId === id) ? null : id;
              },
              closeActionDropdown() {
                  this.activeDropdownId = null;
              },

              executeAction(actionType, id) {
                  this.activeDropdownId = null;
                  // --- FUNGSI EDIT / TAMPIL ---
                  if (actionType === 'editCuti') this.editCuti(id);
                  if (actionType === 'editIK') window.openModalIK && window.openModalIK(id);
                  if (actionType === 'editIP') window.openModalIP && window.openModalIP(id);
                  if (actionType === 'editWFHPlan') window.openModalWFH && window.openModalWFH(id);
                  if (actionType === 'laporWFH' || actionType === 'editWFHLap') window.openModalLaporanWFH && window.openModalLaporanWFH(id);
                  
                  // --- FUNGSI DELETE / BATAL (NATIVE VUE) ---
                  if (actionType === 'batalCuti') this.deleteCutiRecord(id);
                  if (actionType === 'batalIK') this.deleteIK(id);
                  if (actionType === 'batalIP') this.deleteIP(id);
                  if (actionType === 'batalWFH') this.deleteWFH(id);
                  if (actionType === 'usulBatalCuti') {
                      if (typeof window.openCancelModal === 'function') {
                          window.openCancelModal(id);
                      } else if (window.vmFormCuti && typeof window.vmFormCuti.openCancelModal === 'function') {
                          window.vmFormCuti.openCancelModal(id);
                      }
                  }
                  
                  // --- FUNGSI CETAK ---
                  if (actionType === 'cetakCuti') window.printCutiForm && window.printCutiForm(id);
                  if (actionType === 'unduhSignedCuti') window.downloadSignedCutiPdf && window.downloadSignedCutiPdf(id);
                  if (actionType === 'cetakIK') window.cetakIzinKeluar && window.cetakIzinKeluar(id);
                  if (actionType === 'cetakIP') window.cetakIzinPribadi && window.cetakIzinPribadi(id);

                      if (window.showNotify) window.showNotify("Error", "Data pengajuan cuti tidak ditemukan.", "error");
                      return;
                  }
                  if (window.vmFormCuti) {
                      window.vmFormCuti.openModal(false, log);
                  } else {
                      if (window.showNotify) window.showNotify("Error Modul", "Sistem Vue Form belum termuat. Coba muat ulang halaman.", "error");
                  }
              },
              
              deleteCutiRecord(id) {
                  const token = localStorage.getItem('transkep_session_token');
                  const currentNip = this.s && this.s.user ? this.s.user.nip : '';
                  const confirmFn = window.showCustomConfirm || function(t, m, cb) {
                      if (confirm(`${t}\n\n${m}`)) cb();
                  };

                  confirmFn("Tarik Pengajuan", "Batalkan dan tarik pengajuan ini? Saldo cuti Anda akan dikembalikan utuh.", () => {
                      if (window.showLoading) window.showLoading("Menarik data...");
                      google.script.run
                          .withSuccessHandler((res) => {
                              if (window.hideLoading) window.hideLoading();
                              if (res.status === 'success') {
                                  if (window.showNotify) window.showNotify("Ditarik", res.message, "success");
                                  
                                  const logIndex = this.s.cutiLogs.findIndex(l => String(l.id) === String(id));
                                  if (logIndex !== -1) {
                                      const logToCancel = this.s.cutiLogs[logIndex];
                                      const logStatus = String(logToCancel.status || '').trim().toLowerCase();
                                      // Proses Refund Saldo (Hanya jika belum pernah ditolak, diminta perubahan, atau dibatalkan)
                                      if (logStatus !== 'ditolak' && logStatus !== 'perubahan' && logStatus !== 'dibatalkan') {
                                          window.terapkanRefundCutiClient(this.s.user, logToCancel);
                                      }
                                      
                                      // Update juga referensi di usersList agar data admin tidak desinkronisasi
                                      if (this.s.usersList) {
                                          const uIdx = this.s.usersList.findIndex(u => String(u.nip) === String(this.s.user.nip));
                                          if (uIdx !== -1) this.s.usersList[uIdx] = Object.assign({}, this.s.user);
                                      }
                                      
                                      // Secara Reaktif hapus dari UI
                                      this.s.cutiLogs.splice(logIndex, 1);

                                  const idx = this.s.wfhLogs.findIndex(l => String(l.id) === String(id));
                                  if (idx !== -1) this.s.wfhLogs.splice(idx, 1);
                                  if (typeof syncAllServerData === 'function') syncAllServerData(true);
                              } else { 
                                  if (window.showNotify) window.showNotify("Gagal Membatalkan", res.message, "error"); 
                              }
                          })
                          .withFailureHandler((err) => {
                              if (window.hideLoading) window.hideLoading();
                              if (window.showNotify) window.showNotify("Error Jaringan", err.toString(), "error");
                          })
                          .deleteWfhLog(id, false, currentNip, token); 
                  });
              }
          },
          mounted() {
              // TAHAP 43: Auto-close dropdown saat pengguna klik di luar container
              document.addEventListener('click', (e) => {
                  if (!e.target.closest('.dropdown-action-container')) {
                      this.activeDropdownId = null;
                  }
              });
          }
      }).mount('#vue-riwayat-permohonan');
  });

</script>
