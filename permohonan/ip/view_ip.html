<!-- =========================================================================
     ZETTBOS MODULAR UI: MODAL FORM IZIN PRIBADI (VUE MIGRATED)
========================================================================== -->
<div id="vue-form-ip-wrapper" v-cloak>
  <div id="modalFormIP" :class="{'hidden': !isOpen}" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
      <div :class="{'scale-95': !isScaled}" class="w-full max-w-lg glass border border-emerald-500/30 p-6 rounded-3xl shadow-2xl flex flex-col transition-all duration-300 transform">
        
        <!-- Header Modal -->
        <div class="flex items-center justify-between pb-4 border-b border-slate-800 shrink-0">
          <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-user-clock text-emerald-400 mr-2"></i> Formulir Izin Pribadi</h3>
          <button @click="closeModal" type="button" class="text-slate-400 hover:text-rose-400 transition-colors w-8 h-8 flex items-center justify-center bg-slate-800/50 hover:bg-rose-500/10 rounded-lg">
             <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <!-- Body Form -->
        <form @submit.prevent="submitForm" class="mt-4 space-y-4 text-xs">
           
           <div class="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl flex items-start gap-3 mb-2">
             <i class="fa-solid fa-circle-info text-emerald-400 mt-0.5"></i>
             <p class="text-[10px] text-emerald-400/90 leading-relaxed font-medium">
                Izin Pribadi digunakan untuk keperluan mendesak (1 Hari). Pengajuan ini memerlukan persetujuan Atasan Langsung dan Pejabat Berwenang.
             </p>
           </div>
           
           <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-1">
              <label class="block text-slate-400 uppercase font-bold mb-1">Tanggal Izin</label>
              <input type="date" v-model="form.tanggal" required class="w-full px-3.5 py-3 bg-slate-900 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>

          <div>
            <label class="block text-slate-400 uppercase font-bold mb-1">Alamat Selama Izin</label>
            <textarea v-model="form.alamat" required rows="2" placeholder="Masukkan alamat lengkap Anda selama masa izin..." class="w-full px-3.5 py-3 bg-slate-900 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
          </div>

          <div>
            <label class="block text-slate-400 uppercase font-bold mb-1">Keperluan / Alasan Izin</label>
            <textarea v-model="form.alasan" required rows="2" placeholder="Ketik alasan (Contoh: dikarenakan cuti tahunan saya sudah habis dan ada keperluan keluarga...)" class="w-full px-3.5 py-3 bg-slate-900 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
          </div>

          <div v-show="opsiAtasan.adaPlh || opsiPejabat.adaPlh" class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl flex items-start gap-3 mb-2 mt-4">
             <i class="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5"></i>
             <p class="text-[10px] text-amber-400/90 leading-relaxed font-medium">Sistem mendeteksi Pejabat Definitif sedang tidak berada di tempat hari ini. Pilihan dialihkan ke Pelaksana Harian (Plh).</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                  <label class="block text-emerald-400 uppercase font-bold mb-1">Atasan Langsung</label>
                  <select v-model="form.atasan_nip" required class="w-full px-3.5 py-3 bg-slate-950 border border-emerald-500/50 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                    <option value="" disabled>-- Pilih Atasan --</option>
                    <option v-for="opt in opsiAtasan.list" :key="opt.nip" :value="opt.nip">
                      {{ opt.nama }} ({{ opt.jabatan }})
                    </option>
                  </select>
              </div>
              <div>
                  <label class="block text-emerald-400 uppercase font-bold mb-1">Pejabat Berwenang</label>
                  <select v-model="form.pejabat_nip" required class="w-full px-3.5 py-3 bg-slate-950 border border-emerald-500/50 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                    <option value="" disabled>-- Pilih Pejabat --</option>
                    <option v-for="opt in opsiPejabat.list" :key="opt.nip" :value="opt.nip">
                      {{ opt.nama }} ({{ opt.jabatan }})
                    </option>
                  </select>
              </div>
          </div>

          <button type="submit" class="w-full py-4 mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-[0_4px_15px_rgba(16,185,129,0.2)] transition uppercase tracking-wider flex items-center justify-center gap-2">
            Kirim Izin Pribadi <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
  </div>
</div>
