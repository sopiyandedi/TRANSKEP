<script>
  // ==========================================
  // LOGIKA CLIENT-SIDE: E-KINERJA (SKP)
  // ==========================================

  function renderKinerjaView() {
     // Siapkan dropdown atasan di form
     const selectPejabat = document.getElementById('knjPejabat');
     if(selectPejabat && selectPejabat.options.length <= 1) {
        const superiors = state.usersList.filter(u => {
            const role = u.role.toLowerCase();
            return role.includes('atasan') || role.includes('pejabat') || role.includes('admin') || role.includes('ketua');
        });
        superiors.forEach(sup => {
            const opt = document.createElement('option');
            opt.value = sup.nip;
            opt.innerText = `${sup.nama} (${sup.jabatan})`;
            selectPejabat.appendChild(opt);
        });
     }

     renderKinerjaTable();
  }

  function renderKinerjaTable() {
     const tbody = document.getElementById('tblKinerjaBody');
     if(!tbody) return;
     tbody.innerHTML = "";

     // Filter Elements
     const fltTahun = document.getElementById('filterKinerjaTahun').value;
     const fltPeriode = document.getElementById('filterKinerjaPeriode').value;
     const fltSearch = document.getElementById('kinerjaSearchInput').value.toLowerCase().trim();

     let dataToRender = [...state.kinerjaList];

     // Role Based Filtering
     const myNip = state.user.nip;
     const myRole = state.user.role.toLowerCase();
     
     if (myRole.includes('admin') || myRole.includes('operator')) {
         // Admin melihat semua data
     } else if (myRole.includes('pejabat') || myRole.includes('atasan') || myRole.includes('ketua')) {
         // Pejabat melihat miliknya sendiri ATAU yang ditugaskan kepadanya sebagai penilai
         dataToRender = dataToRender.filter(k => k.nip === myNip || k.pejabat_nip === myNip);
     } else {
         // Pegawai biasa HANYA melihat miliknya sendiri
         dataToRender = dataToRender.filter(k => k.nip === myNip);
     }

     // Apply Filter UI
     if (fltTahun !== 'all') dataToRender = dataToRender.filter(k => k.tahun === fltTahun);
     if (fltPeriode !== 'all') dataToRender = dataToRender.filter(k => k.periode === fltPeriode);

     // Apply Search
     if (fltSearch !== "") {
         dataToRender = dataToRender.filter(k => {
             const u = state.usersList.find(x => String(x.nip) === String(k.nip)) || {nama:'', jabatan:''};
             return u.nama.toLowerCase().includes(fltSearch) || u.jabatan.toLowerCase().includes(fltSearch);
         });
     }

     // Sort terbaru di atas
     dataToRender.reverse();

     if (dataToRender.length === 0) {
         tbody.innerHTML = `<tr><td colspan="6" class="text-center p-12 text-slate-500 italic"><i class="fa-regular fa-folder-open text-3xl mb-3 block opacity-50"></i>Tidak ada dokumen E-Kinerja yang ditemukan.</td></tr>`;
         return;
     }

     dataToRender.forEach((k, index) => {
         const pegawai = state.usersList.find(u => String(u.nip) === String(k.nip)) || { nama: 'Unknown', jabatan: '-' };
         const pejabat = state.usersList.find(u => String(u.nip) === String(k.pejabat_nip)) || { nama: 'Unknown' };

         let statusBadge = "";
         let actionButtons = "";

         if (k.status === 'Menunggu TTE') {
             statusBadge = `<span class="inline-flex px-2 py-1 rounded bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[10px] font-bold uppercase"><i class="fa-solid fa-clock mr-1"></i> Menunggu Penilai</span>`;
             
             if (k.pejabat_nip === myNip || myRole.includes('admin')) {
                 actionButtons = `<button onclick="sahkanKinerja('${k.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-emerald-500/20"><i class="fa-solid fa-signature mr-1"></i> Sahkan & TTE</button>`;
             } else {
                 actionButtons = `<span class="text-xs text-slate-500 italic">Diproses...</span>`;
             }
         } else {
             statusBadge = `<span class="inline-flex px-2 py-1 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold uppercase"><i class="fa-solid fa-check-double mr-1"></i> Telah Disahkan</span>
                            <div class="text-[9px] text-slate-500 mt-1 font-mono">${k.tgl_tte}</div>`;
             
             actionButtons = `<a href="${k.file_pengesahan}" target="_blank" class="px-3 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 text-indigo-400 hover:text-white border border-indigo-500/30 hover:border-indigo-500 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-file-pdf"></i> Unduh Lembar TTE</a>`;
         }

         const tr = document.createElement('tr');
         tr.className = "border-b border-slate-900 hover:bg-slate-900/10 transition";
         tr.innerHTML = `
            <td class="p-4 text-center font-mono text-slate-500">${index + 1}</td>
            <td class="p-4">
               <div class="font-bold text-slate-200">${pegawai.nama}</div>
               <div class="text-[10px] text-slate-500 mt-0.5">NIP: ${k.nip} | ${pegawai.jabatan}</div>
               <div class="text-[9px] text-slate-400 mt-1"><span class="text-slate-600">Penilai:</span> ${pejabat.nama}</div>
            </td>
            <td class="p-4 text-center">
               <div class="font-bold text-slate-300 text-xs">${k.periode}</div>
               <div class="font-mono text-indigo-400 text-xs font-bold">${k.tahun}</div>
            </td>
            <td class="p-4 text-center text-xs font-bold text-slate-300">${k.predikat}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4">
               <div class="flex flex-col items-center gap-2">
                  ${actionButtons}
                  <div class="flex gap-2">
                     <a href="${k.file_penilaian}" target="_blank" title="Buka File Penilaian Asli" class="text-[10px] text-slate-400 hover:text-indigo-400 transition underline underline-offset-2"><i class="fa-solid fa-paperclip"></i> Penilaian</a>
                     <a href="${k.file_evaluasi}" target="_blank" title="Buka File Evaluasi Asli" class="text-[10px] text-slate-400 hover:text-indigo-400 transition underline underline-offset-2"><i class="fa-solid fa-paperclip"></i> Evaluasi</a>
                  </div>
               </div>
            </td>
         `;
         tbody.appendChild(tr);
     });
  }

  function openKinerjaModal() {
     document.getElementById('formKinerja').reset();
     document.getElementById('knjNamaDisplay').innerText = state.user.nama;
     document.getElementById('knjNipDisplay').innerText = state.user.nip;
     
     const modal = document.getElementById('modalFormKinerja');
     modal.classList.remove('hidden');
     setTimeout(() => { if(modal.firstElementChild) modal.firstElementChild.classList.remove('scale-95'); }, 10);
  }

  function closeKinerjaModal() {
     const modal = document.getElementById('modalFormKinerja');
     if(modal.firstElementChild) modal.firstElementChild.classList.add('scale-95');
     setTimeout(() => modal.classList.add('hidden'), 200);
  }

  function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
          reader.readAsDataURL(file);
      });
  }

  async function submitKinerja(e) {
     e.preventDefault();
     
     const filePenilaian = document.getElementById('knjFilePenilaian').files[0];
     const fileEvaluasi = document.getElementById('knjFileEvaluasi').files[0];

     if (filePenilaian.size > 2 * 1024 * 1024 || fileEvaluasi.size > 2 * 1024 * 1024) {
         showNotify("File Terlalu Besar", "Setiap file maksimal berukuran 2 MB untuk menjaga performa server.", "error");
         return;
     }

     showLoading("Membaca dokumen PDF...");
     try {
         const base64Penilaian = await readFileAsBase64(filePenilaian);
         const base64Evaluasi = await readFileAsBase64(fileEvaluasi);

         const payload = {
             nip: state.user.nip,
             tahun: document.getElementById('knjTahun').value,
             periode: document.getElementById('knjPeriode').value,
             predikat: document.getElementById('knjPredikat').value,
             pejabat_nip: document.getElementById('knjPejabat').value,
             filePenilaianData: base64Penilaian.split(',')[1],
             fileEvaluasiData: base64Evaluasi.split(',')[1],
             fileMimeType: 'application/pdf',
             fileNameBase: `SKP_${state.user.nip}_${document.getElementById('knjTahun').value}`
         };

         showLoading("Mengunggah dokumen ke brankas Google Drive...");
         google.script.run
             .withSuccessHandler(function(res) {
                 hideLoading();
                 if (res.status === 'success') {
                     closeKinerjaModal();
                     showNotify("Sukses Upload", "Dokumen SKP telah dikirim ke atasan untuk disahkan.", "success");
                     syncAllServerData();
                 } else {
                     showNotify("Gagal Upload", res.message, "error");
                 }
             })
             .withFailureHandler(function(err) {
                 hideLoading();
                 showNotify("Error Sistem", err.toString(), "error");
             })
             .addKinerjaLog(payload);

     } catch (err) {
         hideLoading();
         showNotify("Gagal Membaca File", "Terjadi kesalahan saat memproses dokumen lokal Anda.", "error");
     }
  }

  function sahkanKinerja(id) {
     showCustomConfirm("Sah & TTE Dokumen SKP", "Anda akan menandatangani dokumen ini secara elektronik. Sistem akan membuatkan Lembar Pengesahan ber-Barcode. Lanjutkan?", function() {
        
        showLoading("Membangun Dokumen Tanda Tangan Elektronik...");
        google.script.run
            .withSuccessHandler(function(res) {
                hideLoading();
                if(res.status === 'success') {
                    showNotify("Pengesahan Berhasil", "Dokumen SKP telah resmi disahkan secara elektronik.", "success");
                    syncAllServerData();
                } else {
                    showNotify("Gagal Pengesahan", res.message, "error");
                }
            })
            .withFailureHandler(function(err) {
                hideLoading();
                showNotify("Error Jaringan", err.toString(), "error");
            })
            .approveKinerja(id, state.user.nip);

     });
  }
</script>
