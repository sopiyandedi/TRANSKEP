<script>

  // Fungsi Kosong (Agar pemanggilan dari renderDashboardView Vanilla JS tidak error)
  function generateWarningsData() {
      // Logic dipindahkan ke rawWarningsData di Vue (js_dashboard.html)
  }

  function openStatusUpdateModal(nip, type, currentStatus, nama) {
      let modal = document.getElementById('modalStatusTMT');
      if (!modal) {
          const html = `
          <div id="modalStatusTMT" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity opacity-0 hidden">
             <div class="glass border border-slate-800 bg-slate-900/95 rounded-3xl w-full max-w-sm flex flex-col shadow-2xl transform transition-transform duration-300 scale-95 mx-4 overflow-hidden">
                <div class="p-5 border-b border-slate-800/60 bg-slate-900/80 flex items-center justify-between">
                   <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-list-check text-indigo-400"></i> Update Status Berkas</h3>
                   <button type="button" onclick="closeStatusUpdateModal()" class="text-slate-400 hover:text-rose-400 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="p-6 space-y-4">
                   <div class="text-center mb-2">
                       <p class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Atas Nama</p>
                       <p id="statusModalNama" class="text-sm font-bold text-slate-200 mt-0.5">-</p>
                       <p id="statusModalJenis" class="text-xs text-indigo-400 font-bold mt-1 bg-indigo-500/10 inline-block px-2 py-0.5 rounded border border-indigo-500/20">-</p>
                   </div>
                   <input type="hidden" id="statusModalNip">
                   <div class="grid grid-cols-1 gap-2">
                      <button onclick="submitTmtStatus('Menunggu')" class="py-3 px-4 rounded-xl text-xs font-bold transition flex items-center justify-between group border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700">
                         <span class="flex items-center gap-2"><i class="fa-regular fa-clock text-slate-400"></i> Reset Status (Tarik Kembali)</span>
                      </button>
                      <button onclick="submitTmtStatus('Proses')" class="py-3 px-4 rounded-xl text-xs font-bold transition flex items-center justify-between group border border-blue-500/30 bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 shadow-lg shadow-blue-500/5">
                         <span class="flex items-center gap-2"><i class="fa-solid fa-gears text-blue-400 group-hover:animate-spin"></i> Tandai Sedang Diproses</span>
                      </button>
                      <button onclick="submitTmtStatus('Selesai')" class="py-3 px-4 rounded-xl text-xs font-bold transition flex items-center justify-between group border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 shadow-lg shadow-emerald-500/5">
                         <span class="flex items-center gap-2"><i class="fa-solid fa-check-double text-emerald-400"></i> Tandai Selesai / Terbit</span>
                         <span class="text-[9px] text-emerald-500/60 font-normal">Auto-maju stlh 1 bln</span>
                      </button>
                   </div>
                </div>
             </div>
          </div>`;
          document.body.insertAdjacentHTML('beforeend', html);
          modal = document.getElementById('modalStatusTMT');
      }
      
      document.getElementById('statusModalNip').value = nip;
      document.getElementById('statusModalNama').innerText = nama;
      document.getElementById('statusModalJenis').innerText = "Berkas " + type;
      
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); modal.firstElementChild.classList.remove('scale-95'); }, 10);
  }

  function closeStatusUpdateModal() {
      const modal = document.getElementById('modalStatusTMT');
      if (modal) { modal.classList.add('opacity-0'); modal.firstElementChild.classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); }
  }

  function submitTmtStatus(newStatus) {
    const targetNip = document.getElementById('statusModalNip').value;
    const typeStr = document.getElementById('statusModalJenis').innerText.replace("Berkas ", "");
    const token = localStorage.getItem('transkep_session_token');
    const adminNip = state.user.nip; 

    showLoading("Menyimpan status berkas...");
    google.script.run
      .withSuccessHandler(function(res) {
          hideLoading(); closeStatusUpdateModal();
          if (res.status === 'success') {
              var pesan = (typeStr === 'KGB' && newStatus === 'Proses')
                ? "Status KGB diubah ke Proses. Pegawai telah masuk antrean E-Office!"
                : "Status berkas diperbarui.";
              showNotify("Berhasil Disimpan", pesan, "success");
              let userRef = state.usersList.find(u => String(u.nip) === targetNip); 
              if (userRef) {
                  if (typeStr === 'KGB') { userRef.status_kgb = (newStatus === 'Menunggu') ? '' : newStatus; if(newStatus === 'Selesai') userRef.tgl_selesai_kgb = window.formatYMD(new Date()); else userRef.tgl_selesai_kgb = ''; }
                  if (typeStr === 'Pangkat') { userRef.status_knp = (newStatus === 'Menunggu') ? '' : newStatus; if(newStatus === 'Selesai') userRef.tgl_selesai_knp = window.formatYMD(new Date()); else userRef.tgl_selesai_knp = ''; }
                  if (typeStr === 'Pensiun') { userRef.status_pensiun = (newStatus === 'Menunggu') ? '' : newStatus; if(newStatus === 'Selesai') userRef.tgl_selesai_pensiun = window.formatYMD(new Date()); else userRef.tgl_selesai_pensiun = ''; }
              }
              // Render ulang UI
              if(window.renderDashboardView) window.renderDashboardView();
          } else showNotify("Gagal", res.message, "error");
      })
      .withFailureHandler(function(err) { hideLoading(); closeStatusUpdateModal(); showNotify("Error Sistem", err.toString(), "error"); })
      .updateTmtStatus(adminNip, targetNip, typeStr, newStatus, token); 
  }
</script>
