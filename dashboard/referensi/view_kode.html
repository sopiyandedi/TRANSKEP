<!-- ZETTBOT TAHAP 5B: MODAL KAMUS KODE KLASIFIKASI SURAT -->
<div id="modalKodeSurat" onclick="if(event.target === this) closeKodeSuratModal()" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity opacity-0 hidden">
  <div class="glass border border-slate-800 bg-slate-900/95 rounded-3xl w-full max-w-4xl flex flex-col shadow-2xl transform transition-transform duration-300 scale-95 mx-4 overflow-hidden h-[85vh] md:h-[90vh]">
     
     <!-- Modal Header -->
     <div class="p-5 border-b border-slate-800/60 bg-slate-900/80 flex items-center justify-between shrink-0">
        <h3 class="text-base font-bold text-white flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                <i class="fa-solid fa-book-bookmark"></i>
            </div>
            Kamus Kode Klasifikasi Surat
        </h3>
        <button type="button" onclick="closeKodeSuratModal()" class="text-slate-400 hover:text-emerald-400 transition w-8 h-8 flex items-center justify-center bg-slate-800/50 hover:bg-emerald-500/10 rounded-lg">
           <i class="fa-solid fa-xmark text-lg"></i>
        </button>
     </div>
     
     <!-- Search Bar Area (Sticky) -->
     <div class="p-5 border-b border-slate-800/50 bg-slate-950/50 shrink-0">
         <div class="relative group">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
            <input type="text" id="inputSearchKode" oninput="handleKodeSearch(this.value)" autocomplete="off" placeholder="Ketik kata kunci (Misal: 'Cuti', 'Gaji', 'Tugas', 'Hukum')..." class="w-full pl-11 pr-10 py-3.5 bg-slate-900 border border-slate-700/80 focus:border-emerald-500/50 focus:bg-slate-950 rounded-xl text-sm outline-none transition-all text-slate-200 placeholder:text-slate-500 shadow-inner">
            <button id="btnClearKode" onclick="clearKodeSearch()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-rose-400 hidden transition-colors"><i class="fa-solid fa-xmark"></i></button>
         </div>
     </div>

     <!-- Modal Body (Daftar Hasil Pencarian) -->
     <div class="p-5 overflow-y-auto custom-scrollbar flex-1 bg-slate-950/20">
        <div id="kodeResultContainer" class="space-y-2">
            <!-- Tampilan Awal Sebelum Pencarian -->
            <div class="flex flex-col items-center justify-center h-full text-center p-10 opacity-70">
                <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mb-4 border border-slate-700/50">
                    <i class="fa-solid fa-folder-tree text-3xl text-slate-500"></i>
                </div>
                <h4 class="text-slate-300 font-bold text-sm tracking-wide">Pangkalan Data Klasifikasi Arsip</h4>
                <p class="text-slate-500 text-xs mt-2 leading-relaxed max-w-sm">Ketikkan jenis urusan atau dokumen pada kolom pencarian di atas untuk mendapatkan kode surat secara instan.</p>
            </div>
        </div>
     </div>
     
     <!-- Modal Footer -->
     <div class="p-3 border-t border-slate-800/60 bg-slate-900/80 text-center shrink-0">
         <p class="text-[9px] text-slate-500 font-medium uppercase tracking-widest"><i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i> Referensi: SK SEKMA No. 627/SEK/SK/VII/2023</p>
     </div>

  </div>
</div>
