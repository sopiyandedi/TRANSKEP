<script>
  // ==========================================
  // File: js_dashboard_grafik.html
  // ZETTBOT: Modul Khusus Analitik, Chart.js & Export Data
  // ==========================================

  var chartInstanceGender = null;
  var chartInstanceGolongan = null;
  var chartInstanceJabatan = null;
  var chartInstanceUsia = null;
  var isCarouselDragInitialized = false;

  // --- ZETTBOT: GLOBAL SCRUBBER & SORTING ENGINE (JABATAN) ---
  // Berjalan otomatis setiap 1 detik. Menghapus Admin dan mengurutkan seluruh Pegawai 
  // murni berdasarkan Hierarki Jabatan sesuai daftar.
  setInterval(function() {
      if (typeof state !== 'undefined' && state.usersList && state.usersList.length > 0) {
          var isChanged = false;
          var initialLength = state.usersList.length;

          // 1. FILTERING: Hapus Admin & Operator
          var filteredList = state.usersList.filter(function(u) {
              var role = String(u.role || '').toUpperCase();
              var jab = String(u.jabatan || '').toUpperCase();
              var nama = String(u.nama || '').toUpperCase();
              return role !== 'ADMIN' && role !== 'OPERATOR' && jab !== 'ADMIN' && nama.indexOf('SUPER ADMIN') === -1;
          });

          // 2. KAMUS BOBOT JABATAN: Diambil dari daftar opsi hierarki instansi
          function getJabatanWeight(jabatanStr) {
              if (!jabatanStr) return 0;
              var j = String(jabatanStr).toUpperCase().trim();
              
              if (j === 'KETUA') return 100;
              if (j === 'WAKIL KETUA') return 99;
              if (j === 'HAKIM UTAMA MUDA' || j.indexOf('HAKIM') !== -1) return 98;
              if (j === 'PANITERA') return 97;
              if (j === 'SEKRETARIS') return 96;
              if (j === 'PANITERA MUDA GUGATAN') return 95;
              if (j === 'PANITERA MUDA PERMOHONAN') return 94;
              if (j === 'PANITERA MUDA HUKUM') return 93;
              if (j.indexOf('PANITERA MUDA') !== -1) return 92; // Fallback Panmud Lain
              if (j === 'KEPALA SUB BAGIAN UMUM DAN KEUANGAN') return 91;
              if (j === 'KEPALA SUB BAGIAN KEPEGAWAIAN, ORTALA') return 90;
              if (j === 'KEPALA SUB BAGIAN PERENCANAAN, TI DAN PELAPORAN') return 89;
              if (j.indexOf('KEPALA SUB BAGIAN') !== -1) return 88; // Fallback Kasubbag Lain
              if (j === 'PANITERA PENGGANTI') return 87;
              if (j === 'JURU SITA') return 86;
              if (j === 'JURU SITA PENGGANTI') return 85;
              if (j === 'PRANATA KOMPUTER AHLI PERTAMA') return 84;
              if (j === 'ARSIPARIS TERAMPIL') return 83;
              if (j === 'OPERATOR - PENATA LAYANAN OPERASIONAL') return 82;
              if (j === 'KLEREK - ANALIS PERKARA PERADILAN') return 81;
              if (j === 'KLEREK - PENGELOLA PENANGANAN PERKARA') return 80;
              if (j === 'KLEREK - PENGOLAH DATA DAN INFORMASI') return 79;
              if (j === 'PENATA LAYANAN OPERASIONAL') return 78;
              if (j === 'PENGELOLA LAYANAN OPERASIONAL') return 77;
              if (j === 'OPERATOR LAYANAN OPERASIONAL') return 76;
              
              return 0; // Jabatan lainnya / Kosong
          }

          // 3. SORTING ENGINE: Mengurutkan murni dari bobot Jabatan (Tanpa Alfabet)
          filteredList.sort(function(a, b) {
              var weightA = getJabatanWeight(a.jabatan);
              var weightB = getJabatanWeight(b.jabatan);
              return weightB - weightA; // Descending (100 -> 0)
          });

          // 4. DETEKSI PERUBAHAN: Cegah render berulang yang bikin lag
          if (filteredList.length !== initialLength) {
              isChanged = true;
          } else {
              for (var i = 0; i < filteredList.length; i++) {
                  if (filteredList[i].nip !== state.usersList[i].nip) {
                      isChanged = true;
                      break;
                  }
              }
          }

          // 5. UPDATE MEMORY GLOBAL
          state.usersList = filteredList;

          if (isChanged) {
              renderAllCharts();
              // Update live pencarian jika user sedang mengetik
              var searchInput = document.getElementById('globalEmployeeSearch');
              if (searchInput && searchInput.value.trim() !== '') {
                  window.handleEmployeeSearch(searchInput.value);
              }
          }
      }
  }, 1000);

  // --- ZETTBOT: OVERRIDE FUNGSI GLOBAL SEARCH ---
  window.handleEmployeeSearch = function(keyword) {
      var content = document.getElementById('searchResultContent');
      var panel = document.getElementById('searchResultPanel');
      var btnClear = document.getElementById('btnClearSearch');
      
      if (!keyword || keyword.trim() === '') {
          if(panel) panel.classList.add('hidden');
          if(btnClear) btnClear.classList.add('hidden');
          return;
      }
      
      if(btnClear) btnClear.classList.remove('hidden');
      if(panel) panel.classList.remove('hidden');
      
      var kw = keyword.toLowerCase().trim();
      
      var filtered = state.usersList.filter(function(u) {
          var nipClean = String(u.nip || '').replace(/[^0-9]/g, '');
          var genderLabel = '';
          if (nipClean.length >= 15) {
              genderLabel = (nipClean.charAt(14) === '2') ? 'perempuan' : 'laki-laki';
          } else {
              var jk = String(u.jk || '').toLowerCase();
              genderLabel = (jk.indexOf('perempuan') !== -1 || jk === 'p') ? 'perempuan' : 'laki-laki';
          }
          
          var nama = String(u.nama || '').toLowerCase();
          var nipStr = String(u.nip || '').toLowerCase();
          var jab = String(u.jabatan || '').toLowerCase();
          var pangkat = String(u.pangkat || '').toLowerCase();
          
          return nama.indexOf(kw) !== -1 || 
                 nipStr.indexOf(kw) !== -1 || 
                 jab.indexOf(kw) !== -1 ||
                 pangkat.indexOf(kw) !== -1 ||
                 genderLabel.indexOf(kw) !== -1;
      });
      
      if (filtered.length === 0) {
          content.innerHTML = '<div class="p-3 text-center text-slate-400 text-sm">Pencarian untuk <span class="text-white font-bold">"'+keyword+'"</span> tidak ditemukan.</div>';
          return;
      }
      
      var html = '';
      filtered.forEach(function(u) {
          var pNama = u.nama || '-';
          var pNip = u.nip || '-';
          var pPangkat = u.pangkat || '-';
          var pJabatan = u.jabatan || '-';
          
          html += '<div class="p-3 hover:bg-slate-800/80 rounded-xl cursor-pointer transition-colors border border-transparent hover:border-slate-700/50 mb-1">';
          html += '  <div class="text-sm font-bold text-slate-200">' + pNama + '</div>';
          html += '  <div class="text-[11px] text-slate-400 mt-1 flex flex-wrap items-center gap-2">';
          html += '    <span class="bg-indigo-500/10 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-500/20">' + pPangkat + '</span>';
          html += '    <span class="text-indigo-300">' + pNip + '</span>';
          html += '    <span class="text-slate-600">&bull;</span>';
          html += '    <span class="text-slate-400">' + pJabatan + '</span>';
          html += '  </div>';
          html += '</div>';
      });
      content.innerHTML = html;
  };

  // --- MODUL DRAG-TO-SCROLL CAROUSEL ---
  function initChartCarouselDrag() {
      if (isCarouselDragInitialized) return; 
      var slider = document.getElementById('chartCarousel');
      if (!slider) return;
      var isDown = false, startX, scrollLeft;

      slider.addEventListener('mousedown', function(e) {
        isDown = true; slider.style.cursor = 'grabbing';
        slider.classList.remove('snap-x', 'snap-mandatory'); 
        startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft;
      });
      slider.addEventListener('mouseleave', function() {
        isDown = false; slider.style.cursor = 'grab';
        slider.classList.add('snap-x', 'snap-mandatory');
      });
      slider.addEventListener('mouseup', function() {
        isDown = false; slider.style.cursor = 'grab';
        slider.classList.add('snap-x', 'snap-mandatory');
      });
      slider.addEventListener('mousemove', function(e) {
        if (!isDown) return; e.preventDefault();
        var x = e.pageX - slider.offsetLeft;
        slider.scrollLeft = scrollLeft - ((x - startX) * 1.5); 
      });
      isCarouselDragInitialized = true;
  }

  function renderAllCharts() {
      try {
          var male = 0, female = 0, total = 0;
          var pCounts = {}, jCounts = {}, uCounts = {};

          var usiaKategori = ['21-30', '31-35', '36-40', '41-45', '46-50', '51-55', '56-60', '61-70'];
          usiaKategori.forEach(function(k) { uCounts[k] = 0; });

          if (!state.usersList || state.usersList.length === 0) return;

          state.usersList.forEach(function(u) {
              total++;
              
              var nipClean = String(u.nip || '').replace(/[^0-9]/g, '');
              var isGenderCounted = false;

              if (nipClean.length >= 15) {
                  var genderDigit = nipClean.charAt(14);
                  if (genderDigit === '2') { female++; isGenderCounted = true; } 
                  else if (genderDigit === '1') { male++; isGenderCounted = true; }
              }

              if (!isGenderCounted) {
                  var jk = String(u.jk || '').toUpperCase().trim();
                  if (jk.indexOf('PEREMPUAN') !== -1 || jk === 'P' || jk === 'WANITA' || jk === 'PR') { female++; } 
                  else { male++; }
              }

              var pk = u.pangkat || 'Belum Diisi';
              pCounts[pk] = (pCounts[pk] || 0) + 1;

              var jb = u.jabatan || 'Belum Diisi';
              jCounts[jb] = (jCounts[jb] || 0) + 1;

              if (nipClean.length >= 15) {
                  var by = parseInt(nipClean.substring(0, 4));
                  var age = new Date().getFullYear() - by;
                  if (age >= 21 && age <= 30) uCounts['21-30']++;
                  else if (age >= 31 && age <= 35) uCounts['31-35']++;
                  else if (age >= 36 && age <= 40) uCounts['36-40']++;
                  else if (age >= 41 && age <= 45) uCounts['41-45']++;
                  else if (age >= 46 && age <= 50) uCounts['46-50']++;
                  else if (age >= 51 && age <= 55) uCounts['51-55']++;
                  else if (age >= 56 && age <= 60) uCounts['56-60']++;
                  else if (age >= 61 && age <= 70) uCounts['61-70']++;
              }
          });

          var onChartClickTrigger = function(e, elements) {
             if(elements.length > 0) {
                 var idx = elements[0].index;
                 var val = elements[0].element.$context.parsed.y || elements[0].element.$context.parsed.x || 0;
                 var labelStr = e.chart.data.labels[idx] || '';
                 
                 var searchInput = document.getElementById('globalEmployeeSearch');
                 if(searchInput) {
                     searchInput.value = labelStr;
                     window.handleEmployeeSearch(labelStr);
                     searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                 }
             }
          };

          // 1. RENDER GENDER
          var ctxG = document.getElementById('genderChartAdmin');
          var elTotal = document.getElementById('chartTotalUserAdmin');
          if (ctxG) {
              if (chartInstanceGender) chartInstanceGender.destroy();
              chartInstanceGender = new Chart(ctxG.getContext('2d'), {
                  type: 'doughnut',
                  data: { labels: ['Laki-laki', 'Perempuan'], datasets: [{ data: [male, female], backgroundColor: ['#3b82f6', '#f43f5e'], borderWidth: 0, hoverOffset: 4 }] },
                  options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } } }, onClick: onChartClickTrigger }
              });
              if (elTotal) elTotal.innerText = total;
          }

          // 2. RENDER PANGKAT GOLONGAN
          var pLabels = Object.keys(pCounts), pData = pLabels.map(function(l) { return pCounts[l]; });
          if (chartInstanceGolongan) chartInstanceGolongan.destroy();
          var ctxP = document.getElementById('golonganChart');
          if (ctxP) {
              chartInstanceGolongan = new Chart(ctxP.getContext('2d'), {
                  type: 'bar',
                  data: { labels: pLabels, datasets: [{ label: 'Pegawai', data: pData, backgroundColor: '#10b981', borderRadius: 4 }] },
                  options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { display: false }, ticks: { color: '#94a3b8', autoSkip: false, font: { size: 10 } } } }, onClick: onChartClickTrigger }
              });
          }
          var elTotPangkat = document.getElementById('totalPangkatText');
          if(elTotPangkat) elTotPangkat.innerHTML = '<span class="inline-block w-2 h-2 rounded bg-emerald-500 mr-1"></span> Total Data: <span class="font-bold text-slate-200">' + total + ' Pegawai</span>';

          // 3. RENDER JABATAN
          var jLabels = Object.keys(jCounts), jData = jLabels.map(function(l) { return jCounts[l]; });
          if (chartInstanceJabatan) chartInstanceJabatan.destroy();
          var ctxJ = document.getElementById('jabatanChart');
          if (ctxJ) {
              chartInstanceJabatan = new Chart(ctxJ.getContext('2d'), {
                  type: 'bar',
                  data: { labels: jLabels, datasets: [{ label: 'Pegawai', data: jData, backgroundColor: '#f59e0b', borderRadius: 4 }] },
                  options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { display: false }, ticks: { color: '#94a3b8', autoSkip: false, font: { size: 10 } } } }, onClick: onChartClickTrigger }
              });
          }
          var elTotJabatan = document.getElementById('totalJabatanText');
          if(elTotJabatan) elTotJabatan.innerHTML = '<span class="inline-block w-2 h-2 rounded bg-amber-500 mr-1"></span> Total Data: <span class="font-bold text-slate-200">' + total + ' Pegawai</span>';

          // 4. RENDER USIA
          var uLabels = Object.keys(uCounts), uData = uLabels.map(function(l) { return uCounts[l]; });
          if (chartInstanceUsia) chartInstanceUsia.destroy();
          var ctxUsia = document.getElementById('usiaChart');
          if (ctxUsia) {
              chartInstanceUsia = new Chart(ctxUsia.getContext('2d'), {
                  type: 'bar',
                  data: { labels: uLabels, datasets: [{ label: 'Pegawai', data: uData, backgroundColor: '#f43f5e', borderRadius: 4 }] },
                  options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { display: false }, ticks: { color: '#94a3b8', autoSkip: false, font: { size: 10 } } } }, onClick: onChartClickTrigger }
              });
          }
          var elTotUsia = document.getElementById('totalUsiaText');
          if(elTotUsia) elTotUsia.innerHTML = '<span class="inline-block w-2 h-2 rounded bg-rose-500 mr-1"></span> Total Data: <span class="font-bold text-slate-200">' + total + ' Pegawai</span>';

          initChartCarouselDrag();
      } catch (err) {
          console.error("Gagal render grafik:", err);
      }
  }

  function downloadChartImage(canvasId, fileNamePrefix) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) {
          if (typeof showNotify === 'function') showNotify("Gagal Mengunduh", "Elemen grafik tidak ditemukan di halaman.", "error");
          return;
      }
      var dateObj = new Date();
      var months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sept", "Okt", "Nov", "Des"];
      var dateStr = dateObj.getDate() + "-" + months[dateObj.getMonth()] + "-" + dateObj.getFullYear();
      var finalFileName = fileNamePrefix + "_" + dateStr + ".png";

      var ctx = canvas.getContext('2d');
      var originalCompositeOperation = ctx.globalCompositeOperation;
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = "#0f172a"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      var imageURI = canvas.toDataURL("image/png");
      ctx.globalCompositeOperation = originalCompositeOperation;

      var downloadLink = document.createElement("a");
      downloadLink.href = imageURI;
      downloadLink.download = finalFileName;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      if (typeof showNotify === 'function') showNotify("Berhasil Disimpan", "Grafik berhasil diunduh!", "success");
  }
</script>
