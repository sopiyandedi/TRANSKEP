  <!-- ========================================== -->
  <!-- 1. HALAMAN LOGIN OTENTIK TRANSKEP -->
  <!-- ========================================== -->
  <div id="login-section" class="w-full h-screen flex flex-col items-center justify-center p-4">
     <div class="w-full max-w-md relative">
        <div class="absolute -top-10 -left-10 w-48 h-48 bg-indigo-500/30 rounded-full blur-[80px] pointer-events-none"></div>
        <div class="absolute -bottom-10 -right-10 w-48 h-48 bg-purple-500/20 rounded-full blur-[80px] pointer-events-none"></div>

        <!-- Header & Logo Burung Hantu -->
        <div class="mb-6 relative z-10 flex flex-row items-center justify-center gap-4">
           <img src="img/logo.png" onerror="this.onerror=null; this.src='https://lh3.googleusercontent.com/d/1xbfVM1yO_o0sn5XV6fIsqFK2GIC6k95J=w400'" alt="Logo TRANSKEP" class="w-24 md:w-28 h-auto drop-shadow-[0_0_15px_rgba(99,102,241,0.3)] object-contain transition-all hover:scale-105 duration-300 shrink-0 cursor-pointer" onclick="toggleThemeMode()" title="Klik Logo untuk Beralih Mode Terang/Gelap">
           
           <div class="text-left flex flex-col justify-center">
               <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 tracking-wider drop-shadow-[0_0_15px_rgba(99,102,241,0.5)] leading-tight">TRANSKEP</h1>
               <p class="text-slate-400 text-xs md:text-sm font-medium tracking-wide">Transparansi Kepegawaian</p>
           </div>
        </div>
        
        <!-- Formulir Login Glassmorphism -->
        <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off" class="relative z-10 border border-white/10 p-8 rounded-[2rem] shadow-[0_8px_32px_rgba(0,0,0,0.3)] bg-white/5 backdrop-blur-sm shadow-[inset_0_1px_1px_rgba(255,255,255,0.1)]">
           <div class="space-y-6">
              <div>
                 <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">Nomor Induk Pegawai (NIP)</label>
                 <div class="relative group">
                    <i class="fa-regular fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                    <input type="text" id="loginNip" required autocomplete="off" placeholder="Masukkan NIP Anda" class="w-full pl-11 pr-4 py-3.5 bg-slate-950/50 border border-slate-700/50 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-slate-900 outline-none transition-all duration-300 shadow-inner">
                 </div>
              </div>
              <div>
                 <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">Password</label>
                 <div class="relative group">
                    <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                    <input type="password" id="loginPass" required autocomplete="new-password" placeholder="••••••••" class="w-full pl-11 pr-12 py-3.5 bg-slate-950/50 border border-slate-700/50 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-slate-900 outline-none transition-all duration-300 shadow-inner">
                    <button type="button" onclick="const p = document.getElementById('loginPass'); const i = document.getElementById('loginPassIcon'); if (p.type === 'password') { p.type = 'text'; i.classList.replace('fa-eye-slash', 'fa-eye'); } else { p.type = 'password'; i.classList.replace('fa-eye', 'fa-eye-slash'); }" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-indigo-400 focus:outline-none transition-colors">
                        <i id="loginPassIcon" class="fa-solid fa-eye-slash"></i>
                    </button>
                 </div>
                 
                 <div class="flex justify-end mt-4">
                    <button type="button" onclick="openLupaPassword()" class="px-4 py-2 rounded-xl text-[11px] font-bold text-purple-300 bg-purple-500/10 border border-purple-500/20 hover:bg-purple-500/20 hover:border-purple-500/40 hover:text-purple-100 backdrop-blur-sm transition-all duration-300 shadow-[0_4px_15px_rgba(168,85,247,0.15)] flex items-center gap-2 outline-none">
                        <i class="fa-solid fa-unlock-keyhole"></i> Lupa password?
                    </button>
                 </div>
              </div>
              <div class="pt-4">
                 <button type="submit" id="btnLoginSubmit" class="w-full py-4 rounded-xl text-xs font-bold text-indigo-300 bg-indigo-500/10 border border-indigo-500/20 hover:bg-indigo-500/20 hover:border-indigo-500/40 hover:text-indigo-100 backdrop-blur-sm transition-all duration-300 shadow-[0_4px_15px_rgba(99,102,241,0.15)] uppercase flex items-center justify-center gap-3 tracking-widest group">
                    Masuk Aplikasi <i class="fa-solid fa-arrow-right-to-bracket transition-transform duration-300 group-hover:translate-x-1"></i>
                 </button>
              </div>
           </div>
        </form>
     </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. MODAL LUPA PASSWORD (RESET SANDI WA) -->
  <!-- ========================================== -->
  <div id="modalLupaPassword" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
     <div class="glass border border-slate-800/60 p-6 rounded-3xl shadow-2xl bg-slate-900/90 w-full max-w-sm scale-95 transition-transform duration-300" id="modalLupaPasswordContent">
         <h3 class="text-lg font-black text-white mb-2 tracking-wide"><i class="fa-solid fa-shield-halved text-amber-500 mr-2"></i> Reset Sandi</h3>
         <p class="text-[11px] text-slate-400 mb-5 leading-relaxed">Masukkan Nomor WhatsApp Anda yang terdaftar pada sistem. Admin akan memverifikasi dan mengirimkan sandi ke WA Anda.</p>
         
         <form onsubmit="submitLupaPassword(event)">
             <div class="mb-5">
                 <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Nomor WhatsApp Terdaftar</label>
                 <div class="relative">
                     <i class="fa-brands fa-whatsapp absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                     <input type="text" id="waLupaPassword" required placeholder="Contoh: 0812345..." class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition text-slate-200">
                 </div>
             </div>
             <div class="flex gap-3">
                 <button type="button" onclick="closeLupaPassword()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition">Batal</button>
                 <button type="submit" id="btnSubmitLupa" class="flex-1 py-3 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-2">
                     Kirim <i class="fa-regular fa-paper-plane"></i>
                 </button>
             </div>
         </form>
     </div>
  </div>
