<!-- VIEW COMPONENT: pkp/rekap_pkp_template.html -->
<div id="template-rekap-pck-bkn" style="display:none;" class="no-print">
  <style>
    @media print {
      @page { size: A4 portrait; margin: 15mm; }
      html, body { background: white !important; color: black !important; font-family: 'Times New Roman', Times, serif; font-size: 10pt; margin:0; padding:0; }
      
      /* ZETTBOT FIX: Hide semua elemen UI saat mencetak template ini */
      body.print-mode-rekap > * { display: none !important; }
      body.print-mode-rekap > #template-rekap-pck-bkn { display: block !important; position: relative; width: 100%; box-sizing: border-box; }
      
      .text-center { text-align: center; } 
      .text-right { text-align: right; } 
      .font-bold { font-weight: bold; }
      
      /* Tabel Identitas Atas */
      .meta-table { width: 55%; border-collapse: collapse; margin-bottom: 25px; }
      .meta-table td { border: 1px solid black; padding: 5px 8px; vertical-align: middle; }
      
      /* Tabel Utama */
      .table-data { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 9.5pt; }
      .table-data th, .table-data td { border: 1px solid black; padding: 6px 4px; vertical-align: middle; }
      
      /* ZETTBOT TRICK: Membuat Header Tabel berulang di setiap halaman jika halamannya panjang! */
      thead { display: table-header-group; }
      
      /* Area TTD (Rata Kanan) */
      .sig-area { width: 100%; margin-top: 40px; display: flex; justify-content: flex-end; page-break-inside: avoid;}
      .sig-box { width: 300px; text-align: center; }
      .sig-space { height: 75px; }
      
      /* Catatan Bawah */
      .notes-area { font-size: 9.5pt; margin-top: 40px; text-align: left; line-height: 1.4; page-break-inside: avoid; }
    }
  </style>
