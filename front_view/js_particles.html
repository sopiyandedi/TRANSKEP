<!-- KANVAS BACKGROUND ANIMASI -->
<!-- ZETTBOT FIX: Kembali gunakan z-index: -10 agar mutlak di belakang menu HP -->
<canvas id="loginParticleCanvas" style="z-index: -10 !important;" class="fixed inset-0 w-full h-full pointer-events-none opacity-40"></canvas>

<script>
  // ==========================================
  // ZETTBOT: PARTICLE NETWORK BACKGROUND ENGINE
  // ==========================================
  function initLoginParticles() {
    if (window.loginParticlesInitialized) return;
    const canvas = document.getElementById("loginParticleCanvas");
    if (!canvas) return;
    window.loginParticlesInitialized = true;

    const mainContent = document.getElementById("main-content");
    if (mainContent) {
        mainContent.classList.remove("bg-slate-950");
    }
    const ctx = canvas.getContext("2d");
    
    let particlesArray = [];
    let animationFrameId;
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Radius interaksi mouse
    let mouse = {
      x: null,
      y: null,
      radius: (canvas.height/80) * (canvas.width/80)
    };

    window.addEventListener("mousemove", function(event) {
      mouse.x = event.x;
      mouse.y = event.y;
    });

    window.addEventListener("mouseout", function() {
      mouse.x = undefined;
      mouse.y = undefined;
    });

    window.addEventListener("resize", function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      mouse.radius = (canvas.height/80) * (canvas.width/80);
      init();
    });

    class Particle {
      constructor(x, y, directionX, directionY, size, color) {
        this.x = x;
        this.y = y;
        this.directionX = directionX;
        this.directionY = directionY;
        this.size = size;
        this.color = color;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        ctx.fillStyle = this.color;
        ctx.fill();
      }

      update() {
        // Pantulkan jika menyentuh pinggir layar
        if (this.x > canvas.width || this.x < 0) {
          this.directionX = -this.directionX;
        }
        if (this.y > canvas.height || this.y < 0) {
          this.directionY = -this.directionY;
        }

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        // Efek Interaksi: Menghindar saat didekati kursor mouse
        if (distance < mouse.radius + this.size) {
          if (mouse.x < this.x && this.x < canvas.width - this.size * 10) { this.x += 1.5; }
          if (mouse.x > this.x && this.x > this.size * 10) { this.x -= 1.5; }
          if (mouse.y < this.y && this.y < canvas.height - this.size * 10) { this.y += 1.5; }
          if (mouse.y > this.y && this.y > this.size * 10) { this.y -= 1.5; }
        }

        this.x += this.directionX;
        this.y += this.directionY;
        this.draw();
      }
    }

    function init() {
      particlesArray = [];
      // Mengatur kepadatan partikel berdasarkan ukuran layar (Responsive)
      let numberOfParticles = (canvas.height * canvas.width) / 12000;
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 2) + 1;
        let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
        let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
        let directionX = (Math.random() * 1.5) - 0.75;
        let directionY = (Math.random() * 1.5) - 0.75;
        let color = '#6366f1'; // Warna titik (Indigo-500 khas TRANSKEP)
        particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
      }
    }

    function animate() {
      animationFrameId = requestAnimationFrame(animate);
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      connect();
    }

    // Fungsi menggambar garis penghubung antar titik
    function connect() {
      let opacityValue = 1;
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) +
                         ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
          
          if (distance < (canvas.width / 7) * (canvas.height / 7)) {
            opacityValue = 1 - (distance / 15000);
            ctx.strokeStyle = 'rgba(99, 102, 241,' + opacityValue + ')'; // Warna garis (Indigo-500)
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    init();
    animate();
  }

  // ZETTBOT: Eksekusi Instan (0ms delay)
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initLoginParticles);
  } else {
    initLoginParticles();
  }
</script>
