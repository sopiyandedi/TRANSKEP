<!-- =========================================================
     MOBILE UI: TOP APP BAR & BOTTOM NAVIGATION
     Hanya muncul di layar Mobile/Tablet (di bawah breakpoint 'lg')
     ========================================================= -->

<!-- 1. TOP APP BAR (Sticky Header HP) -->
<div id="mobile-top-bar" class="lg:hidden fixed top-0 left-0 right-0 h-16 z-[900] glass border-b border-slate-800/60 bg-slate-900/90 backdrop-blur-xl flex items-center justify-between px-3.5 shadow-sm transition-all duration-300" v-cloak>
    
    <!-- Profil Singkat & Info Pegawai -->
    <div class="flex items-center gap-2.5 overflow-hidden cursor-pointer shrink" onclick="switchMenu('dashboard')">
        <div id="mobile-avatar" class="w-9 h-9 rounded-xl flex items-center justify-center text-white text-xs font-black shadow-md border border-indigo-400/30 bg-gradient-to-br from-indigo-500 to-purple-600 shrink-0">
            {{ userInitials }}
        </div>
        <div class="flex flex-col min-w-0">
            <h2 id="mobile-user-name" class="text-xs font-bold text-slate-200 truncate leading-tight">{{ cleanName }}</h2>
            <div class="flex items-center gap-1.5 mt-0.5">
                <p id="mobile-user-role" class="text-[9px] text-indigo-400 font-medium truncate uppercase tracking-wider">{{ currentUser ? (currentUser.jabatan || 'Pegawai') : 'Memuat...' }}</p>
                <span id="mobile-sync-badge" class="inline-flex items-center"></span>
            </div>
        </div>
    </div>

    <!-- Tombol Aksi Kanan (Tema Dinamis, Reset Password & Logout) -->
    <div class="flex items-center gap-2 shrink-0">
        <!-- Tombol Alih Tema: Ikon Matahari saat Gelap, Ikon Bulan saat Terang -->
        <button id="btn-theme-mobile" onclick="toggleThemeMode()" class="w-9 h-9 shrink-0 flex items-center justify-center bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20 text-amber-400 hover:text-amber-300 rounded-xl transition-all duration-300 shadow-sm shadow-amber-500/5 active:scale-95" title="Beralih Mode Terang / Gelap">
            <i id="mobile-theme-icon" class="fa-solid fa-sun text-sm"></i>
        </button>
        <!-- Tombol Reset Kata Sandi (Identik dengan Header Desktop) -->
        <button onclick="openChangePasswordModal()" class="w-9 h-9 shrink-0 flex items-center justify-center bg-purple-500/10 hover:bg-purple-500 border border-purple-500/20 hover:border-purple-500 text-purple-400 hover:text-white rounded-xl transition-all duration-300 shadow-md shadow-purple-500/10 active:scale-95" title="Ganti Kata Sandi">
            <i class="fa-solid fa-key text-sm"></i>
        </button>
        <!-- Tombol Keluar Sistem / Logout (Identik dengan Header Desktop) -->
        <button onclick="handleLogout()" class="w-9 h-9 shrink-0 flex items-center justify-center bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 hover:border-rose-500 text-rose-400 hover:text-white rounded-xl transition-all duration-300 shadow-md shadow-rose-500/10 active:scale-95" title="Keluar Sistem">
            <i class="fa-solid fa-power-off text-sm"></i>
        </button>
    </div>
</div>

<!-- 2. BOTTOM NAVIGATION BAR (Navigasi Jempol) -->
<div id="mobile-bottom-nav" style="bottom: 0 !important; top: auto !important; position: fixed !important;" class="lg:hidden fixed bottom-0 left-0 right-0 h-[68px] z-[9999] glass border-t border-slate-800/60 bg-slate-900/95 backdrop-blur-xl flex items-center justify-around px-2 shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
    
    <!-- Tombol 1: Dashboard -->
    <button onclick="switchMobileMenu('dashboard')" id="mob-nav-dashboard" class="mobile-nav-btn relative flex flex-col items-center justify-center w-16 h-full text-indigo-400 group">
        <div class="absolute -top-1 w-8 h-1 bg-indigo-500 rounded-b-md transition-all duration-300 opacity-100 scale-x-100"></div>
        <i class="fa-solid fa-house text-lg mb-1 transition-transform group-active:scale-90"></i>
        <span class="text-[9px] font-bold tracking-wide">Home</span>
    </button>

    <!-- Tombol 2: Cuti & Izin -->
    <button onclick="switchMobileMenu('permohonan')" id="mob-nav-permohonan" class="mobile-nav-btn relative flex flex-col items-center justify-center w-16 h-full text-slate-500 hover:text-slate-300 group transition-colors">
        <div class="absolute -top-1 w-8 h-1 bg-indigo-500 rounded-b-md transition-all duration-300 opacity-0 scale-x-0"></div>
        <i class="fa-solid fa-file-signature text-lg mb-1 transition-transform group-active:scale-90"></i>
        <span class="text-[9px] font-bold tracking-wide">Cuti</span>
    </button>

    <!-- Tombol 3: PKP / Kinerja -->
    <button onclick="switchMobileMenu('pkp')" id="mob-nav-pkp" class="mobile-nav-btn relative flex flex-col items-center justify-center w-16 h-full text-slate-500 hover:text-slate-300 group transition-colors">
        <div class="absolute -top-1 w-8 h-1 bg-indigo-500 rounded-b-md transition-all duration-300 opacity-0 scale-x-0"></div>
        <i class="fa-solid fa-file-invoice text-lg mb-1 transition-transform group-active:scale-90"></i>
        <span class="text-[9px] font-bold tracking-wide">Kinerja</span>
        <!-- Badge Notifikasi PKP Mobile -->
        <span id="badge-pkp-mob" class="absolute top-1 right-2 w-3 h-3 bg-rose-500 border border-slate-900 rounded-full hidden"></span>
    </button>

    <!-- Tombol 4: Menu Lainnya (Membuka Sidebar Utama) -->
    <button onclick="openMobileSidebar()" id="mob-nav-lainnya" class="relative flex flex-col items-center justify-center w-16 h-full text-slate-500 hover:text-slate-300 group transition-colors">
        <i class="fa-solid fa-bars text-lg mb-1 transition-transform group-active:scale-90"></i>
        <span class="text-[9px] font-bold tracking-wide">Menu</span>
    </button>
</div>
