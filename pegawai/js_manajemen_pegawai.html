<script>
  // ---------------------------------------------------------
  // FUNGSI HELPER: KONVERSI TANGGAL GOOGLE SHEET KE HTML5
  // ---------------------------------------------------------
  function parseDateToHTML5(sheetDateStr) {
    if (!sheetDateStr) return "";
    if (sheetDateStr.includes('-') && sheetDateStr.split('-')[0].length === 4) return sheetDateStr;
    
    const parts = sheetDateStr.includes('/') ? sheetDateStr.split('/') : sheetDateStr.split('-');
    if (parts.length === 3) {
        let day = parts[0].padStart(2, '0');
        let month = parts[1].padStart(2, '0');
        let year = parts[2];
        if (year.length === 2) year = "20" + year;
        return `${year}-${month}-${day}`;
    }
    return "";
  }

  // ---------------------------------------------------------
  // FUNGSI BACKUP (EXPORT KE EXCEL)
  // ---------------------------------------------------------
  function exportPegawaiToExcel() {
    if (typeof XLSX === 'undefined') {
       showNotify('Library Terblokir', 'Modul export excel gagal dimuat koneksi.', 'error');
       return;
    }
    
    const dataExport = state.usersList.map(u => ({
        'NIP': u.nip, 'Nama': u.nama, 'Jabatan': u.jabatan, 'Role': u.role, 'No_HP': u.no_hp, 'Password': u.pass,
        'Sisa_Tahunan_2024': u.s_tahunan_2024, 'Sisa_Tahunan_2025': u.s_tahunan_2025, 'Sisa_Tahunan_2026': u.s_tahunan_2026,
        'Sisa_Sakit': u.s_sakit, 'Sisa_Penting': u.s_penting, 'Sisa_Besar': u.s_besar, 'Sisa_Melahirkan': u.s_melahirkan, 'Sisa_CLTN': u.s_cltn,
        'Pangkat': u.pangkat, 'Jenis_Jabatan': (u.jenis_jabatan || 'Fungsional Umum'), 'Alamat': u.alamat,
        'TMT_KGB': u.tmt_kgb, 'TMT_KNP': u.tmt_knp, 'BUP': u.bup
    }));

    if(dataExport.length === 0) {
        showNotify('Perhatian', 'Tidak ada data untuk dibackup.', 'error');
        return;
    }

    try {
        const ws = XLSX.utils.json_to_sheet(dataExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Master_Pegawai");
        XLSX.writeFile(wb, "Backup_Pegawai_TRANSKEP.xlsx");
        showNotify('Backup Berhasil', 'Data pegawai telah diunduh ke perangkat Anda.', 'success');
    } catch (error) {
        showNotify('Gagal Memproses', 'Terjadi kesalahan saat membuat file.', 'error');
    }
  }

  // ---------------------------------------------------------
  // FUNGSI IMPORT (UPLOAD EXCEL)
  // ---------------------------------------------------------
  function handleImportPegawai(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" }); 
            
            if (json.length === 0) {
                showNotify('Import Gagal', 'File Excel yang diunggah kosong.', 'error');
                return;
            }

            if (!json[0].hasOwnProperty('NIP') || !json[0].hasOwnProperty('Nama')) {
                showNotify('Import Ditolak', 'Format Excel tidak sesuai. Wajib menggunakan format hasil Backup.', 'error');
                return;
            }

            showCustomConfirm(
                "Konfirmasi Sinkronisasi", 
                "Ditemukan " + json.length + " data profil di dalam file. Sistem akan menimpa NIP yang sudah ada. Lanjutkan?", 
                function() {
                    showLoading("Memasukkan data ke database...");
                    google.script.run
                        .withSuccessHandler(res => {
                            hideLoading();
                            document.getElementById('importPegawaiInput').value = ''; 
                            if(res.status === 'success') {
                                showNotify('Import Selesai', res.message, 'success');
                                syncAllServerData(); 
                            } else {
                                showNotify('Import Gagal', res.message, 'error');
                            }
                        })
                        .withFailureHandler(err => {
                            hideLoading();
                            document.getElementById('importPegawaiInput').value = ''; 
                            showNotify('Error Sistem', err.toString(), 'error');
                        })
                        .importBulkUsers(json);
                }
            );

        } catch(error) {
            document.getElementById('importPegawaiInput').value = ''; 
            showNotify('Import Gagal', 'Dokumen rusak atau tidak terbaca sebagai Excel murni.', 'error');
        }
    };
    reader.readAsArrayBuffer(file);
  }

    "Panitera Muda Gugatan", "Panitera Muda Permohonan", "Panitera Muda Hukum",

    "Kepala Sub Bagian Perencanaan, TI dan Pelaporan", "Panitera Pengganti",
    "Juru Sita", "Juru Sita Pengganti", "Pranata Komputer Ahli Pertama",
    "Operator - Penata Layanan Operasional", "Arsiparis Terampil",
    "Klerek - Analis Perkara Peradilan", "Klerek - Pengelola Penanganan Perkara",
    "Klerek - Pengolah Data dan Informasi", "Penata Layanan Operasional",
    "Pengelola Layanan Operasional", "Operator Layanan Operasional"
  ];

  function getBobotJabatan(jabatan) {
    if (!jabatan) return 999;
    const index = hierarkiJabatan.findIndex(j => j.toLowerCase() === jabatan.toLowerCase().trim());
    return index !== -1 ? index : 999;
  }

  function togglePassVisibility(nip, passLengkap) {
    const mainTxt = document.getElementById('pass-main-txt-' + nip);
    const mainIcon = document.getElementById('pass-main-icon-' + nip);

    if (mainIcon && mainIcon.classList.contains("fa-eye-slash")) {
      if(mainTxt) mainTxt.innerText = passLengkap;
      if(mainIcon) mainIcon.className = "fa-solid fa-eye text-xs text-indigo-400";
    } else {
      if(mainTxt) mainTxt.innerText = "••••••••";
      if(mainIcon) mainIcon.className = "fa-solid fa-eye-slash text-xs text-slate-400";
    }
  }

  function filterPegawaiTable() {
    const input = document.getElementById('pegSearchInput');
    const filter = input ? input.value.toLowerCase().trim() : "";
    const tbody = document.getElementById('tblManajemenBody');
    if (!tbody) return;
    
    const rows = tbody.getElementsByTagName('tr');
    for (let i = 0; i < rows.length; i += 2) {
      const mainRow = rows[i];
      const detailRow = rows[i + 1];
      if (!mainRow) continue;

      const nameCell = mainRow.cells[1];
      const jabatanCell = mainRow.cells[2];

      if (nameCell || jabatanCell) {
        const nameText = nameCell.textContent || nameCell.innerText;
        const jabatanText = jabatanCell.textContent || jabatanCell.innerText;
        
        if (nameText.toLowerCase().indexOf(filter) > -1 || jabatanText.toLowerCase().indexOf(filter) > -1) {
          mainRow.style.display = "";
        } else {
          mainRow.style.display = "none";
          if (detailRow) {
            detailRow.style.display = "none";
            const nip = mainRow.id.replace('peg-main-row-', '');
            const chevron = document.getElementById('chevron-peg-' + nip);
            if (chevron) chevron.classList.remove('rotate-180');
            detailRow.classList.add('hidden');
          }
        }
      }
    }
  }

  function togglePegDetail(nip) {
    const row = document.getElementById('peg-detail-row-' + nip);
    const chevron = document.getElementById('chevron-peg-' + nip);
    
    if (row && chevron) {
      const isHidden = row.classList.contains('hidden');
      if (isHidden) {
        row.classList.remove('hidden');
        chevron.classList.add('rotate-180');
      } else {
        row.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        const passMainTxt = document.getElementById('pass-main-txt-' + nip);
        const passMainIcon = document.getElementById('pass-main-icon-' + nip);
        if (passMainTxt && passMainIcon) { passMainTxt.innerText = "••••••••"; passMainIcon.className = "fa-solid fa-eye-slash text-xs text-slate-400"; }
      }
    }
  }

  function openPegawaiModal(mode, nip) {
    document.getElementById('formPegawai').reset();
    document.getElementById('pegMode').value = mode;

    const title = document.getElementById('pegModalTitle');
    const nipInput = document.getElementById('pegNip');

    if (mode === 'add') {
      title.innerHTML = '<i class="fa-solid fa-user-plus text-indigo-400 mr-2"></i> Tambah Pegawai Baru';
      nipInput.removeAttribute('readonly');
      document.getElementById('pegCuti2024').value = 0;
      document.getElementById('pegCuti2025').value = 0;
      document.getElementById('pegCuti2026').value = 12;
      document.getElementById('pegSakit').value = 30;
      document.getElementById('pegPenting').value = 15;
      document.getElementById('pegBesar').value = 90;
      document.getElementById('pegMelahirkan').value = 90;
      document.getElementById('pegCltn').value = 0;
      document.getElementById('pegTmtKgb').value = "";
      document.getElementById('pegTmtKnp').value = "";
      document.getElementById('pegBup').value = "58";
      
      // ZETTBOT: Default UI Slider saat ditambah
      setJenisJabatan('Fungsional Umum');
    } else {
      title.innerHTML = '<i class="fa-solid fa-user-pen text-indigo-400 mr-2"></i> Perbarui Profil Pegawai';
      nipInput.setAttribute('readonly', 'true');

      const u = state.usersList.find(usr => usr.nip === nip);
      if (u) {
        document.getElementById('pegOriginalNip').value = u.nip;
        document.getElementById('pegNip').value = u.nip;
        document.getElementById('pegNama').value = u.nama;
        document.getElementById('pegJabatan').value = u.jabatan;
        document.getElementById('pegPangkat').value = u.pangkat || "";
        document.getElementById('pegRole').value = u.role;
        document.getElementById('pegNoHp').value = u.no_hp;
        document.getElementById('pegPass').value = u.pass;
        document.getElementById('pegAlamat').value = u.alamat || "";
        document.getElementById('pegCuti2024').value = u.s_tahunan_2024;
        document.getElementById('pegCuti2025').value = u.s_tahunan_2025;
        document.getElementById('pegCuti2026').value = u.s_tahunan_2026;
        document.getElementById('pegSakit').value = u.s_sakit;
        document.getElementById('pegPenting').value = u.s_penting;
        document.getElementById('pegBesar').value = u.s_besar;
        document.getElementById('pegMelahirkan').value = u.s_melahirkan;
        document.getElementById('pegCltn').value = u.s_cltn;
        document.getElementById('pegTmtKgb').value = parseDateToHTML5(u.tmt_kgb);
        document.getElementById('pegTmtKnp').value = parseDateToHTML5(u.tmt_knp);
        document.getElementById('pegBup').value = u.bup || "58";
        
        // ZETTBOT: Sesuaikan UI Slider saat diedit
        setJenisJabatan(u.jenis_jabatan || 'Fungsional Umum');
      }
    }

    document.getElementById('modalPegawai').classList.remove('hidden');
  }

  function closePegawaiModal() {
    document.getElementById('modalPegawai').classList.add('hidden');
  }

  function submitPegawai(e) {
    e.preventDefault();
    const mode = document.getElementById('pegMode').value;
    const payload = {
      nip: document.getElementById('pegNip').value,
      nama: document.getElementById('pegNama').value,
      jabatan: document.getElementById('pegJabatan').value,
      pangkat: document.getElementById('pegPangkat').value,
      role: document.getElementById('pegRole').value,
      no_hp: document.getElementById('pegNoHp').value,
      pass: document.getElementById('pegPass').value,
      alamat: document.getElementById('pegAlamat').value,
      s_tahunan_2024: Number(document.getElementById('pegCuti2024').value),
      s_tahunan_2025: Number(document.getElementById('pegCuti2025').value),
      s_tahunan_2026: Number(document.getElementById('pegCuti2026').value),
      s_sakit: Number(document.getElementById('pegSakit').value),
      s_penting: Number(document.getElementById('pegPenting').value),
      s_besar: Number(document.getElementById('pegBesar').value),
      s_melahirkan: Number(document.getElementById('pegMelahirkan').value),
      s_cltn: Number(document.getElementById('pegCltn').value),
      tmt_kgb: document.getElementById('pegTmtKgb').value,
      tmt_knp: document.getElementById('pegTmtKnp').value,
      bup: Number(document.getElementById('pegBup').value),
      jenis_jabatan: document.getElementById('pegJenisJabatan').value, // ZETTBOT: Tambahan Payload Slider
      originalNip: document.getElementById('pegOriginalNip').value
    };

    showLoading("Mencatat perubahan profil ke database...");

    if (mode === 'add') {
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          closePegawaiModal();
          if (res.status === 'success') {
            showNotify("Profil Disimpan", res.message, "success");
            syncAllServerData();
          } else {
            showNotify("Gagal Menyimpan", res.message, "error");
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          closePegawaiModal();
          showNotify("Error Sistem", err.toString(), "error");
        })
        .addUser(payload);
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          closePegawaiModal();
          if (res.status === 'success') {
            showNotify("Profil Disimpan", res.message, "success");
            syncAllServerData();
          } else {
            showNotify("Gagal Menyimpan", res.message, "error");
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          closePegawaiModal();
          showNotify("Error Sistem", err.toString(), "error");
        })
        .updateUser(payload);
    }
  }

  function deletePegawaiRecord(nip, nama) {
    showCustomConfirm("Hapus Data Pegawai", "Hapus permanen akun PNS atas nama " + nama + " (NIP: " + nip + ")? Tindakan ini tidak dapat dibatalkan.", function() {
      showLoading("Mengeksekusi penghapusan pegawai...");
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoading();
          if (res.status === 'success') {
            showNotify("Berhasil Dihapus", res.message, "success");
            syncAllServerData();
          } else {
            showNotify("Gagal Hapus", res.message, "error");
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showNotify("Error Jaringan", err.toString(), "error");
        })
        .deleteUser(nip);
    });
  }

  // ---------------------------------------------------------
  // ZETTBOT: FUNGSI INTERAKTIF SLIDER JENIS JABATAN
  // ---------------------------------------------------------
  function setJenisJabatan(jenis) {
      document.getElementById('pegJenisJabatan').value = jenis;
      const slider = document.getElementById('jabatanSlider');
      
      const btnS = document.getElementById('btnStruktural');
      const btnFU = document.getElementById('btnFungsionalUmum');
      const btnF = document.getElementById('btnFungsional');

      if (btnS) { btnS.classList.remove('text-white'); btnS.classList.add('text-slate-400'); }
      if (btnFU) { btnFU.classList.remove('text-white'); btnFU.classList.add('text-slate-400'); }
      if (btnF) { btnF.classList.remove('text-white'); btnF.classList.add('text-slate-400'); }

      if (jenis === 'Struktural') {
          slider.style.left = '4px';
          slider.className = 'absolute top-1 bottom-1 w-[32.5%] bg-indigo-600 rounded-lg transition-all duration-300 ease-in-out shadow';
          if (btnS) { btnS.classList.remove('text-slate-400'); btnS.classList.add('text-white'); }
      } else if (jenis === 'Fungsional') {
          slider.style.left = 'calc(67.5% - 4px)';
          slider.className = 'absolute top-1 bottom-1 w-[32.5%] bg-amber-600 rounded-lg transition-all duration-300 ease-in-out shadow';
          if (btnF) { btnF.classList.remove('text-slate-400'); btnF.classList.add('text-white'); }
      } else {
          // Default Fungsional Umum (Tengah)
          slider.style.left = '33.7%';
          slider.className = 'absolute top-1 bottom-1 w-[32.5%] bg-emerald-600 rounded-lg transition-all duration-300 ease-in-out shadow';
          if (btnFU) { btnFU.classList.remove('text-slate-400'); btnFU.classList.add('text-white'); }
      }
  }

  // ---------------------------------------------------------
  // ZETTBOT: FUNGSI KIRIM KREDENSIAL VIA WA
  // ---------------------------------------------------------
  function getSapaanGender(nip) {
      let sapaan = "Bapak/Ibu";
      let nipStr = String(nip).replace(/[^0-9]/g, '');
      if (nipStr.length === 18) {
          let digitKe15 = nipStr.substring(14, 15);
          if (digitKe15 === '1') sapaan = "Bapak";
          else if (digitKe15 === '2') sapaan = "Ibu";
      }
      return sapaan;
  }

  function sendCredentialViaWA(nip) {
    const user = state.usersList.find(u => u.nip === nip);
    if (!user) { showNotify("Data Tidak Ditemukan", "Terjadi kesalahan saat menarik data pegawai.", "error"); return; }
    let rawPhone = user.no_hp || ""; let phone = rawPhone.replace(/[^0-9]/g, ''); 
    if (phone.startsWith('0')) phone = '62' + phone.substring(1);
    if (!phone || phone.length < 9) { showNotify("Gagal Mengirim", "Pegawai tidak memiliki nomor WA.", "error"); return; }
    const appUrl = "https://sites.google.com/view/transkepv2/transkep-v2-1";
    const msg = "*INFORMASI AKUN TRANSKEP* 🏢\nHalo " + getSapaanGender(user.nip) + " *" + user.nama + "*,\n\nBerikut kredensial login Anda:\n\n👤 *NIP / Username:* " + user.nip + "\n🔑 *Kata Sandi:* " + user.pass + "\n\n🔗 *Link Login:*\n" + appUrl;
    window.open("https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(msg), '_blank');
  }

  // ---------------------------------------------------------
  // ZETTBOT: FUNGSI ANTREAN LUPA PASSWORD (ADMIN)
  // ---------------------------------------------------------
  function fetchResetQueue(isOpenModal = false) {
    if (isOpenModal) {
       const container = document.getElementById('queuePassContainer');
       if(container) container.innerHTML = '<div class="text-center p-8 text-slate-500 text-xs"><i class="fa-solid fa-circle-notch fa-spin text-rose-500 mb-3 text-2xl"></i><br>Menyinkronkan data antrean...</div>';
       document.getElementById('modalAntreanPass').classList.remove('hidden');
    }
    google.script.run
      .withSuccessHandler(function(queue) {
         window.currentResetQueue = queue;
         const badge = document.getElementById('badgeQueuePass');
         if (badge) {
             if (queue && queue.length > 0) { badge.innerText = queue.length; badge.classList.remove('hidden'); } 
             else { badge.classList.add('hidden'); }
         }
         const modal = document.getElementById('modalAntreanPass');
         if (modal && !modal.classList.contains('hidden')) renderResetQueue();
      })
      .getResetPasswordQueue();
  }

  function openQueueModal() { fetchResetQueue(true); }
  function closeQueueModal() { document.getElementById('modalAntreanPass').classList.add('hidden'); }

  function renderResetQueue() {
      const container = document.getElementById('queuePassContainer');
      const queue = window.currentResetQueue || [];
      if (queue.length === 0) { container.innerHTML = '<div class="text-center p-8 text-slate-500 text-xs">Antrean kosong.</div>'; return; }
      let html = '';
      queue.forEach(q => {
          const safeNama = String(q.nama || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
          const safePass = String(q.pass || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
          html += 
          '<div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between gap-4">' +
             '<div>' +
                '<div class="font-bold text-slate-200 text-sm mb-0.5">' + q.nama + '</div>' +
                '<div class="text-[10px] text-slate-400 font-mono">NIP: ' + q.nip + ' • WA: ' + q.no_wa + '</div>' +
             '</div>' +
             '<button onclick="processManualWAReset(\'' + q.id + '\', \'' + q.nip + '\', \'' + safeNama + '\', \'' + q.no_wa + '\', \'' + safePass + '\')" class="shrink-0 px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs">Kirim WA</button>' +
          '</div>';
      });
      container.innerHTML = html;
  }

  function processManualWAReset(reqId, nip, name, phone, pass) {
      const appUrl = "https://sites.google.com/view/transkepv2/transkep-v2-1";
      const msg = "*RESET AKUN TRANSKEP* 🏢\nHalo *" + name + "*,\n\nIni kredensial baru Anda:\n👤 *NIP:* " + nip + "\n🔑 *Sandi:* " + pass + "\n\n🔗 *Link Login:*\n" + appUrl;
      const runProcess = () => {
          if (typeof showLoading === 'function') showLoading("Memproses...");
          google.script.run
             .withSuccessHandler(res => {
                 if (typeof hideLoading === 'function') hideLoading();
                 if(res.status === 'success') {
                     showNotify("Selesai", "Berhasil diproses.", "success");
                     fetchResetQueue(); 
                     window.open("https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(msg), '_blank');
                 }
             })
             .markResetAsDone(reqId);
      };
      if (typeof showCustomConfirm === 'function') showCustomConfirm("Proses Antrean?", "Lanjutkan?", runProcess);
      else if(confirm("Kirim kredensial?")) runProcess();
  }

  setTimeout(fetchResetQueue, 1500);

</script>
